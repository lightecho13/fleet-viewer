ng){var eel=eng.querySelectorAll('EnemyEngagement');for(var ei2=0;ei2<eel.length;ei2++){var ee=eel[ei2];var ene=ee.querySelector(':scope > Name');ship.engagements.push({name:cleanTag(ene?ene.textContent:''),status:gt(ee,'EndingStatus')});}}\n          ship.missileDmg=ship.missiles.reduce(function(a,m){return a+m.dmg;},0);\n          ship.dmgDealt=ship.gunDmg+ship.missileDmg;\n          player.ships.push(ship);\n        }\n      }\n      // playerEl\uc758 \uc9c1\uc811 \uc790\uc2dd \uc911 Craft \ud0dc\uadf8\ub9cc \ud0d0\uc0c9 (\uc7ac\uadc0 \ud0d0\uc0c9 \ubc29\uc9c0)\n      for(var cx=0;cx<playerEl.children.length;cx++){\n        var craftEl=playerEl.children[cx];\n        if(craftEl.tagName.toLowerCase()!=='craft') continue;\n        for(var ci=0;ci<craftEl.children.length;ci++){\n          var cbr=craftEl.children[ci];\n          if(cbr.tagName.toLowerCase()!=='craftbattlereport') continue;\n          var craft={name:cleanTag(gt(cbr,'DesignName')),frame:gt(cbr,'FrameName'),team:gt(cbr,'Team'),\n            carried:gi(cbr,'Carried'),lost:gi(cbr,'Lost'),sorties:gi(cbr,'SortiesFlown'),\n            dmgDealt:gi(cbr,'TotalDamageDealt'),strikeWeapons:[],ssWeapons:[]};\n          var sR=cbr.querySelector('StrikeReport');if(sR){var swl=sR.querySelectorAll('WeaponReport');for(var sw=0;sw<swl.length;sw++)craft.strikeWeapons.push(parseCWR(swl[sw]));}\n          var ssR=cbr.querySelector('SpaceSuperiorityReport');if(ssR){var ssl=ssR.querySelectorAll('WeaponReport');for(var ss2=0;ss2<ssl.length;ss2++)craft.ssWeapons.push(parseCWR(ssl[ss2]));}\n          player.crafts.push(craft);\n        }\n      }\n      team.players.push(player);\n    }\n    game.teams.push(team);\n  }\n  return game;\n}\n\nfunction fmtT(s){var m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}\nfunction fmtN(n){return Math.round(n).toLocaleString('en-US');}\nfunction sColor(elim,defanged,condition,evacuated){return elim==='Destroyed'?'var(--dead)':evacuated?'#e8763a':defanged?'var(--text2)':condition>0&&condition<0.6?'var(--warn)':'var(--alive)';}\nfunction sLabel(elim,defanged,condition,evacuated){return elim==='Destroyed'?'Destroyed':evacuated?'Retired':defanged?'Defanged':condition>0&&condition<0.6?'Damaged':'Surviving';}\n\nfunction ratingClass(r){\n  var m={Excellent:'r-excellent',Good:'r-good',Fair:'r-fair',Poor:'r-poor',Terrible:'r-terrible'};\n  return m[r]||'r-na';\n}\n\n// \u2500\u2500 Weapon HTML helpers \u2500\u2500\nfunction gunWHTML(w){\n  var isCont=w.type.indexOf('Continuous')>=0;\n  var acc=w.shots>0?Math.round(w.hits/w.shots*100):0;\n  var ammoUsed=w.rounds>0?Math.min(100,Math.round(w.shots/w.rounds*100)):0;\n  var eff=!isCont&&w.shots>0&&w.maxDmgPerShot>0?Math.round(w.dmg/(w.shots*w.maxDmgPerShot)*100):0;\n  var dmgPotential=w.shots*w.maxDmgPerShot;\n  var tl=isCont?'Beam':'Kinetic';var tc=isCont?'bbc':'bdk';\n  var body=isCont\n    // Beam weapon\n    ?'<div class=\"wsg\" style=\"grid-template-columns:repeat(3,1fr)\"><div class=\"ws\"><div class=\"wsl\">Ticks fired</div><div class=\"wsv\">'+fmtN(w.shots)+'</div></div><div class=\"ws\"><div class=\"wsl\">Ticks hit</div><div class=\"wsv\" style=\"color:var(--alive)\">'+fmtN(w.hits)+'</div></div><div class=\"ws\"><div class=\"wsl\">Over limit</div><div class=\"wsv\" style=\"color:'+(w.overLimit>0?'var(--warn)':'var(--text)')+'\">'+fmtN(w.overLimit)+'</div></div></div>'\n    +'<div class=\"ar\"><span class=\"al\">Accuracy</span><div class=\"at\"><div class=\"af\" style=\"width:'+acc+'%;background:var(--alive)\"></div></div><span class=\"ap\" style=\"color:var(--alive)\">'+acc+'%</span></div>'\n    // Kinetic/Gun weapon\n    :'<div class=\"wsg\" style=\"grid-template-columns:repeat(4,1fr);margin-bottom:.45rem\">'\n    +'<div class=\"ws\"><div class=\"wsl\">Carried</div><div class=\"wsv\">'+fmtN(w.rounds)+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Expended</div><div class=\"wsv\">'+fmtN(w.shots)+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Hits</div><div class=\"wsv\" style=\"color:var(--alive)\">'+fmtN(w.hits)+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Dmg potential</div><div class=\"wsv\">'+fmtN(dmgPotential)+'</div></div>'\n    +'</div>'\n    +'<div class=\"ar\" style=\"margin-bottom:4px\"><span class=\"al\">Accuracy</span><div class=\"at\"><div class=\"af\" style=\"width:'+acc+'%;background:var(--alive)\"></div></div><span class=\"ap\" style=\"color:var(--alive)\">'+acc+'%</span></div>'\n    +'<div class=\"ar\" style=\"margin-bottom:4px\"><span class=\"al\">Ammo used</span><div class=\"at\"><div class=\"af\" style=\"width:'+ammoUsed+'%;background:var(--warn)\"></div></div><span class=\"ap\" style=\"color:var(--warn)\">'+ammoUsed+'%</span></div>'\n    +(eff>0?'<div class=\"ar\"><span class=\"al\">Efficiency</span><div class=\"at\"><div class=\"af\" style=\"width:'+Math.min(eff,100)+'%;background:var(--accent)\"></div></div><span class=\"ap\" style=\"color:var(--accent)\">'+eff+'%</span></div>':'');\n  return '<div class=\"wi\"><div class=\"wih\"><span class=\"wbdg '+tc+'\">'+tl+'</span><span class=\"wn\">'+w.name+'</span><span class=\"wd\" style=\"color:'+(w.dmg>0?'var(--text)':'var(--text3)')+'\">'+fmtN(w.dmg)+'</span></div>'+body+'</div>';\n}\nfunction ewWHTML(w){\n  var isCont=w.type.indexOf('Continuous')>=0;\n  var body=isCont\n    ?'<div class=\"wsg\" style=\"grid-template-columns:repeat(2,1fr)\"><div class=\"ws\"><div class=\"wsl\">Ticks fired</div><div class=\"wsv\">'+fmtN(w.shots)+'</div></div><div class=\"ws\"><div class=\"wsl\">Over limit</div><div class=\"wsv\" style=\"color:'+(w.overLimit>0?'var(--warn)':'var(--text3)')+'\">'+fmtN(w.overLimit)+'</div></div></div>'\n    :'<div class=\"wsg\" style=\"grid-template-columns:repeat(2,1fr)\"><div class=\"ws\"><div class=\"wsl\">Shots fired</div><div class=\"wsv\">'+fmtN(w.shots)+'</div></div><div class=\"ws\"><div class=\"wsl\">Shots hit</div><div class=\"wsv\">'+fmtN(w.hits)+'</div></div></div>';\n  return '<div class=\"wi\"><div class=\"wih\"><span class=\"wbdg bew\">EW</span><span class=\"wn\">'+w.name+'</span><span class=\"wd\" style=\"color:var(--text3)\">&#x2014;</span></div>'+body+'</div>';\n}\nfunction missileHTML(m){\n  var total=m.hits+m.misses;\n  var hr=total>0?Math.round(m.hits/total*100):0;\n  var ammoUsed=m.carried>0?Math.round(m.expended/m.carried*100):0;\n  var seekerInfo=parseMissileDesc(m.desc);\n  var dmgPotential=m.expended*m.indvPotential;\n  var maxPotential=m.carried*m.indvPotential;\n  var eff=dmgPotential>0?Math.min(100,Math.round(m.dmg/dmgPotential*100)):0;\n  return '<div class=\"wi\">'\n    +'<div class=\"wih\"><span class=\"wbdg bms\">Missile</span><span class=\"wn\" style=\"white-space:normal;overflow:visible;text-overflow:unset;word-break:break-word\">'+m.name+'</span><span class=\"wd\" style=\"color:'+(m.dmg>0?'var(--text)':'var(--text3)')+'\">'+fmtN(m.dmg)+'</span></div>'\n    +(seekerInfo?'<div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:.45rem;padding-left:2px\">'+seekerInfo+'</div>':'')\n    // \uc0c1\ub2e8: carried, expended, dmg potential, max potential\n    +'<div class=\"wsg\" style=\"grid-template-columns:repeat(4,1fr);margin-bottom:.45rem\">'\n    +'<div class=\"ws\"><div class=\"wsl\">Carried</div><div class=\"wsv\">'+m.carried+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Expended</div><div class=\"wsv\">'+m.expended+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Dmg potential</div><div class=\"wsv\">'+fmtN(dmgPotential)+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Max potential</div><div class=\"wsv\">'+fmtN(maxPotential)+'</div></div>'\n    +'</div>'\n    // \ubc14: Accuracy, Ammo used, Efficiency\n    +'<div class=\"ar\" style=\"margin-bottom:4px\"><span class=\"al\">Accuracy</span><div class=\"at\"><div class=\"af\" style=\"width:'+hr+'%;background:var(--alive)\"></div></div><span class=\"ap\" style=\"color:var(--alive)\">'+hr+'%</span></div>'\n    +'<div class=\"ar\" style=\"margin-bottom:4px\"><span class=\"al\">Ammo used</span><div class=\"at\"><div class=\"af\" style=\"width:'+ammoUsed+'%;background:var(--warn)\"></div></div><span class=\"ap\" style=\"color:var(--warn)\">'+ammoUsed+'%</span></div>'\n    +(eff>0?'<div class=\"ar\" style=\"margin-bottom:.5rem\"><span class=\"al\">Efficiency</span><div class=\"at\"><div class=\"af\" style=\"width:'+eff+'%;background:var(--accent)\"></div></div><span class=\"ap\" style=\"color:var(--accent)\">'+eff+'%</span></div>':'')\n    // \ud558\ub2e8: hits, misses, soft-kills, hard-kills\n    +'<div class=\"wsg\" style=\"grid-template-columns:repeat(4,1fr)\">'\n    +'<div class=\"ws\"><div class=\"wsl\">Hits</div><div class=\"wsv\" style=\"color:var(--alive)\">'+m.hits+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Misses</div><div class=\"wsv\" style=\"color:var(--text2)\">'+m.misses+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Soft-kills</div><div class=\"wsv\" style=\"color:var(--warn)\">'+m.soft+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Hard-kills</div><div class=\"wsv\" style=\"color:var(--dead)\">'+m.hard+'</div></div>'\n    +'</div>'\n    +'</div>';\n}\n\nfunction craftWHTML(w){\n  var isMissile=w.type.indexOf('Missile')>=0||w.type.indexOf('Craft')>=0;\n  var isCont=w.type.indexOf('Continuous')>=0;\n  var tc=isMissile?'bms':isCont?'bdk':'bdk';\n  var tl=isMissile?'Missile':isCont?'Cannon':'Kinetic';\n  var stats='';\n  if(isMissile){\n    var hr=(w.expended||0)>0?Math.round((w.mhits||0)/(w.expended||1)*100):0;\n    var maxPotential=(w.sortied||0)*(w.indvPotential||0);\n    var dmgEff=maxPotential>0?Math.round(w.dmg/maxPotential*100):0;\n    var cseeker=parseMissileDesc(w.desc||'');\n    stats=(cseeker?'<span class=\"cwit\" style=\"grid-column:1/-1;color:var(--text2);font-size:10px\">'+cseeker+'</span>':'')\n      +'<span class=\"cwit\"><span>Sortied </span>'+(w.sortied||0)+'</span>'\n      +'<span class=\"cwit\"><span>Expended </span>'+(w.expended||0)+'</span>'\n      +'<span class=\"cwit\"><span>Lost </span><span style=\"color:'+(w.lost>0?'var(--dead)':'var(--text3)')+'\">'+(w.lost||0)+'</span></span>'\n      +'<span class=\"cwit\"><span>Hits </span><span style=\"color:var(--alive)\">'+(w.mhits||0)+'</span></span>'\n      +'<span class=\"cwit\"><span>Misses </span>'+(w.mmisses||0)+'</span>'\n      +'<span class=\"cwit\"><span>Hit% </span><span style=\"color:'+(hr>50?'var(--alive)':hr>25?'var(--warn)':'var(--dead)')+'\">'+hr+'%</span></span>'\n      +'<span class=\"cwit\"><span>S-kill </span><span style=\"color:var(--warn)\">'+(w.soft||0)+'</span></span>'\n      +'<span class=\"cwit\"><span>H-kill </span><span style=\"color:var(--dead)\">'+(w.hard||0)+'</span></span>'\n      +(w.indvPotential&&w.sortied?'<span class=\"cwit\"><span>Max potential </span>'+fmtN(w.indvPotential*w.sortied)+'</span>':'')\n      +'<span class=\"cwit\"><span>Dmg </span>'+fmtN(w.dmg)+'</span>'\n      +(dmgEff>0?'<span class=\"cwit\"><span>Eff </span><span style=\"color:var(--accent)\">'+dmgEff+'%</span></span>':'');\n  } else if(isCont){\n    var acc=w.shots>0?Math.round(w.hits/w.shots*100):0;\n    stats='<span class=\"cwit\"><span>Ticks </span>'+fmtN(w.shots)+'</span>'\n      +'<span class=\"cwit\"><span>Acc </span>'+acc+'%</span>'\n      +'<span class=\"cwit\"><span>Dmg </span>'+fmtN(w.dmg)+'</span>';\n  } else {\n    var acc=w.shots>0?Math.round(w.hits/w.shots*100):0;\n    var eff=w.shots>0&&w.maxDmgPerShot>0?Math.round(w.dmg/(w.shots*w.maxDmgPerShot)*100):0;\n    stats='<span class=\"cwit\"><span>'+(isCont?'Ticks':'Fired')+' </span>'+fmtN(w.shots)+'</span>'\n      +'<span class=\"cwit\"><span>Hits </span><span style=\"color:var(--alive)\">'+fmtN(w.hits)+'</span></span>'\n      +(w.maxDmgPerShot>0?'<span class=\"cwit\"><span>Max/shot </span>'+fmtN(w.maxDmgPerShot)+'</span>':'')\n      +'<span class=\"cwit\"><span>Acc </span>'+acc+'%</span>'\n      +(eff>0?'<span class=\"cwit\"><span>Eff </span><span style=\"color:var(--accent)\">'+eff+'%</span></span>':'')\n      +'<span class=\"cwit\"><span>Dmg </span>'+fmtN(w.dmg)+'</span>';\n  }\n  return '<div class=\"cwi\"><div class=\"cwin\"><span class=\"wbdg '+tc+'\" style=\"font-size:10px\">'+tl+'</span> '+w.name+'</div><div class=\"cwis\">'+stats+'</div></div>';\n}\nfunction engHTML(engs,ship){\n  var out='';\n  if(ship&&ship.asiRating&&ship.asiRating!=='NotApplicable'){\n    out+='<div class=\"ratings-row\"><div class=\"rating-item\"><span class=\"rating-label\">Anti-Ship</span><span class=\"rating '+ratingClass(ship.asiRating)+'\">'+ship.asiRating+'</span>';\n    if(ship.asiEff>0) out+='<span style=\"font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:2px\">'+Math.round(ship.asiEff*100)+'% eff</span>';\n    out+='</div></div>';\n  }\n  if(!engs||!engs.length) return out+'<div style=\"font-size:13px;color:var(--text3)\">No engagement data</div>';\n  out+='<div class=\"eng-list\">';\n  for(var i=0;i<engs.length;i++){\n    var e=engs[i];var d=e.status==='Destroyed';\n    out+='<div class=\"eng-item\"><span class=\"eng-dot\" style=\"background:'+(d?'var(--dead)':'var(--text3)')+'\"></span><span class=\"eng-name\">'+e.name+'</span><span class=\"eng-status '+(d?'eng-destroyed':'eng-survived')+'\">'+(d?'Destroyed':'Surviving')+'</span></div>';\n  }\n  return out+'</div>';\n}\n/* engHTML replaced */\nfunction overviewHTML(s){\n  var ppPct=s.partsT>0?Math.round(s.partsD/s.partsT*100):0;\n  var repairPct=s.dmgRecv>0?Math.min(Math.round(s.dmgRepair/s.dmgRecv*100),100):0;\n  var condPct=Math.round(s.condition*100);\n  var ammoPct=Math.round(s.ammoExpended*100);\n  var ppW=ppPct, repW=repairPct, condW=condPct, ammoW=ammoPct;\n  return '<div class=\"dgd\" style=\"grid-template-columns:repeat(3,1fr)\">'\n    +'<div class=\"ds\"><div class=\"dsl\">Total Dmg Dealt</div><div class=\"dsv\">'+fmtN(s.dmgDealt)+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Dmg Received</div><div class=\"dsv\" style=\"color:var(--dead)\">'+fmtN(s.dmgRecv)+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Dmg Repaired</div><div class=\"dsv\" style=\"color:var(--alive)\">'+fmtN(s.dmgRepair)+'</div></div>'\n    +'</div>'\n    +(s.missileDmg>0?'<div class=\"dgd\" style=\"grid-template-columns:repeat(3,1fr)\"><div class=\"ds\"><div class=\"dsl\">Gun Damage</div><div class=\"dsv-sm\">'+fmtN(s.gunDmg)+'</div></div><div class=\"ds\"><div class=\"dsl\">Missile Damage</div><div class=\"dsv-sm\" style=\"color:var(--warn)\">'+fmtN(s.missileDmg)+'</div></div><div class=\"ds\"><div class=\"dsl\">Missiles Fired</div><div class=\"dsv-sm\">'+s.missiles.reduce(function(a,m){return a+m.expended;},0)+'</div></div></div>':'')\n    +'<div class=\"mbs\">'\n    +'<div class=\"mbr\"><div class=\"mbl\"><span>Hull condition</span><span>'+condPct+'%</span></div><div class=\"mbt\"><div class=\"mbf\" style=\"width:'+condW+'%;background:'+(condW>60?'var(--alive)':condW>30?'var(--warn)':'var(--dead)')+'\"></div></div></div>'\n    +'<div class=\"mbr\"><div class=\"mbl\"><span>Dmg repaired</span><span>'+repairPct+'%</span></div><div class=\"mbt\"><div class=\"mbf\" style=\"width:'+repW+'%;background:var(--alive)\"></div></div></div>'\n    +'<div class=\"mbr\"><div class=\"mbl\"><span>Parts destroyed</span><span>'+s.partsD+' / '+s.partsT+'</span></div><div class=\"mbt\"><div class=\"mbf\" style=\"width:'+ppW+'%;background:var(--dead)\"></div></div></div>'\n    +'<div class=\"mbr\"><div class=\"mbl\"><span>Ammo expended</span><span>'+ammoPct+'%</span></div><div class=\"mbt\"><div class=\"mbf\" style=\"width:'+ammoW+'%;background:var(--warn)\"></div></div></div>'\n    +'</div>'\n    +'<div class=\"info-grid\">'\n    +'<div class=\"ds\"><div class=\"dsl\">Point cost</div><div class=\"dsv-sm\">'+fmtN(s.pointCost)+' pts</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Distance</div><div class=\"dsv-sm\">'+fmtN(s.distanceTravelled)+'m</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Time in contact</div><div class=\"dsv-sm\">'+fmtT(s.timeInContact)+'</div></div>'\n    +'</div>';\n}\n\n// \u2500\u2500 Defenses tab \u2500\u2500\nfunction pdWHTML(w){\n  var acc=w.shots>0?Math.round(w.hits/w.shots*100):0;\n  var killRate=w.targetsAssigned>0?Math.round(w.targetsDestroyed/w.targetsAssigned*100):0;\n  return '<div class=\"wi\"><div class=\"wih\">'\n    +(w.weaponCount>1?'<span class=\"wbdg bew\">'+w.weaponCount+'x</span>':'')\n    +'<span class=\"wbdg bdk\">PD</span><span class=\"wn\">'+w.name+'</span><span class=\"wd\" style=\"color:'+(w.dmg>0?'var(--text)':'var(--text3)')+'\">'+fmtN(w.dmg)+'</span></div>'\n    +'<div class=\"wsg\" style=\"grid-template-columns:repeat(4,1fr)\">'\n    +'<div class=\"ws\"><div class=\"wsl\">Shots</div><div class=\"wsv\">'+fmtN(w.shots)+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Hits</div><div class=\"wsv\" style=\"color:var(--alive)\">'+fmtN(w.hits)+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Targets</div><div class=\"wsv\">'+w.targetsAssigned+'</div></div>'\n    +'<div class=\"ws\"><div class=\"wsl\">Kills</div><div class=\"wsv\" style=\"color:var(--alive)\">'+w.targetsDestroyed+'</div></div>'\n    +'</div>'\n    +'<div class=\"ar\" style=\"margin-bottom:4px\"><span class=\"al\">Accuracy</span><div class=\"at\"><div class=\"af\" style=\"width:'+acc+'%;background:var(--alive)\"></div></div><span class=\"ap\" style=\"color:var(--alive)\">'+acc+'%</span></div>'\n    +'<div class=\"ar\"><span class=\"al\">Kill rate</span><div class=\"at\"><div class=\"af\" style=\"width:'+killRate+'%;background:var(--tB)\"></div></div><span class=\"ap\" style=\"color:var(--tB)\">'+killRate+'%</span></div>'\n    +'</div>';\n}\nfunction defensesHTML(s){\n  var out='';\n  // Ratings row\n  var ratings=[];\n  if(s.defRating&&s.defRating!=='NotApplicable') ratings.push(['Defense',s.defRating,s.defEff]);\n  if(ratings.length){\n    out+='<div class=\"ratings-row\">';\n    for(var i=0;i<ratings.length;i++){\n      var r=ratings[i];\n      out+='<div class=\"rating-item\"><span class=\"rating-label\">'+r[0]+'</span><span class=\"rating '+ratingClass(r[1])+'\">'+r[1]+'</span>';\n      if(r[2]>0) out+='<span style=\"font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:2px\">'+Math.round(r[2]*100)+'% eff</span>';\n      out+='</div>';\n    }\n    out+='</div>';\n  }\n  // Missile summary\n  out+='<div class=\"dgd\" style=\"grid-template-columns:repeat(3,1fr);margin-bottom:.9rem\">'\n    +'<div class=\"ds\"><div class=\"dsl\">Missiles incoming</div><div class=\"dsv\">'+s.mslThreatened+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Missiles engaged</div><div class=\"dsv\">'+s.mslEngaged+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Engagement rate</div><div class=\"dsv\">'+(s.mslThreatened>0?Math.round(s.mslEngaged/s.mslThreatened*100):0)+'%</div></div>'\n    +'</div>';\n  // PD weapons\n  if(s.pdWeapons.length){\n    out+='<div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem\">Point Defense</div>';\n    out+='<div class=\"wlist\">';\n    for(var i=0;i<s.pdWeapons.length;i++) out+=pdWHTML(s.pdWeapons[i]);\n    out+='</div>';\n  }\n  // Defensive missiles\n  if(s.defMissiles.length){\n    out+='<div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:.8rem 0 .5rem\">Defensive Missiles</div>';\n    out+='<div class=\"wlist\">';\n    for(var i=0;i<s.defMissiles.length;i++){\n      var m=s.defMissiles[i];\n      var sp=m.targets>0?Math.round(m.successes/m.targets*100):0;\n      var defSeeker=parseMissileDesc(m.desc||'');\n      out+='<div class=\"wi\"><div class=\"wih\"><span class=\"wbdg bms\">Missile</span><span class=\"wn\" style=\"white-space:normal;overflow:visible;text-overflow:unset;word-break:break-word\">'+m.name+'</span><span class=\"wd\" style=\"color:var(--text3)\">'+m.expended+'/'+m.carried+'</span></div>'\n        +(defSeeker?'<div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:.35rem;padding-left:2px\">'+defSeeker+'</div>':'')\n        +'<div class=\"wsg\" style=\"grid-template-columns:repeat(4,1fr)\">'\n        +'<div class=\"ws\"><div class=\"wsl\">Targets</div><div class=\"wsv\">'+m.targets+'</div></div>'\n        +'<div class=\"ws\"><div class=\"wsl\">Intercepts</div><div class=\"wsv\">'+m.interceptions+'</div></div>'\n        +'<div class=\"ws\"><div class=\"wsl\">Successes</div><div class=\"wsv\" style=\"color:'+(m.successes>0?'var(--alive)':'var(--text3)')+'\">'+m.successes+'</div></div>'\n        +'<div class=\"ws\"><div class=\"wsl\">Success%</div><div class=\"wsv\" style=\"color:'+(sp>50?'var(--alive)':sp>20?'var(--warn)':'var(--dead)')+'\">'+sp+'%</div></div>'\n        +'</div></div>';\n    }\n    out+='</div>';\n  }\n  // Decoys\n  if(s.decoys.length){\n    out+='<div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:.8rem 0 .5rem\">Decoys</div>';\n    out+='<div class=\"wlist\">';\n    for(var i=0;i<s.decoys.length;i++){\n      var d=s.decoys[i];\n      var sedPct=d.expended>0?Math.round(d.seductions/d.expended*100):0;\n      out+='<div class=\"wi\"><div class=\"wih\"><span class=\"wbdg bew\">Decoy</span><span class=\"wn\">'+d.name+'</span><span class=\"wd\" style=\"color:var(--text3)\">'+d.expended+'/'+d.carried+'</span></div>'\n        +'<div class=\"wsg\" style=\"grid-template-columns:repeat(3,1fr)\">'\n        +'<div class=\"ws\"><div class=\"wsl\">Carried</div><div class=\"wsv\">'+d.carried+'</div></div>'\n        +'<div class=\"ws\"><div class=\"wsl\">Expended</div><div class=\"wsv\">'+d.expended+'</div></div>'\n        +'<div class=\"ws\"><div class=\"wsl\">Seductions</div><div class=\"wsv\" style=\"color:'+(d.seductions>0?'var(--alive)':'var(--text3)')+'\">'+d.seductions+'</div></div>'\n        +'</div></div>';\n    }\n    out+='</div>';\n  }\n  return out||'<div style=\"font-size:13px;color:var(--text3)\">No defense data</div>';\n}\n\n// \u2500\u2500 Sensors tab \u2500\u2500\nfunction sensorsHTML(s){\n  var out='';\n  if(s.senRating&&s.senRating!=='NotApplicable'){\n    out+='<div class=\"ratings-row\"><div class=\"rating-item\"><span class=\"rating-label\">Sensors</span><span class=\"rating '+ratingClass(s.senRating)+'\">'+s.senRating+'</span>';\n    if(s.senEff>0) out+='<span style=\"font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:2px\">'+Math.round(s.senEff*100)+'% eff</span>';\n    out+='</div></div>';\n  }\n  var stealthPct=Math.round(s.stealthEff*100)+'%';\n  var firstTrackSecs=s.timeOfFirstTrack>0&&_shareGame?s.timeOfFirstTrack-_shareGame.gameStartTs:0;\n  out+='<div class=\"dgd\" style=\"grid-template-columns:repeat(3,1fr)\">'\n    +'<div class=\"ds\"><div class=\"dsl\">Peak tracks held</div><div class=\"dsv\">'+s.peakTracks+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Tracking enemy</div><div class=\"dsv\">'+fmtT(s.timeTrackingEnemy)+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Tracked by enemy</div><div class=\"dsv\" style=\"color:var(--warn)\">'+fmtT(s.timeTracked)+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Time jammed</div><div class=\"dsv\" style=\"color:'+(s.timeJammed>60?'var(--dead)':'var(--text)')+'\">'+Math.round(s.timeJammed)+'s</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Stealth efficiency</div><div class=\"dsv\">'+stealthPct+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Time in contact</div><div class=\"dsv\">'+fmtT(s.timeInContact)+'</div></div>'\n    +(firstTrackSecs>0?'<div class=\"ds\"><div class=\"dsl\">First track at</div><div class=\"dsv\">+'+firstTrackSecs+'s</div></div>':'')\n    +'<div class=\"ds\"><div class=\"dsl\">Sensor EMCON</div><div class=\"dsv\" style=\"color:'+(s.sensorEmcon>0?'var(--accent)':'var(--text3)')+'\">'+Math.round(s.sensorEmcon)+'s</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Total EMCON</div><div class=\"dsv\" style=\"color:'+(s.totalEmcon>0?'var(--accent)':'var(--text3)')+'\">'+Math.round(s.totalEmcon)+'s</div></div>'\n    +'</div>';\n  // EW weapons\n  var activeEW=s.ewWeapons; // \uc7a5\ucc29\ub41c \ubaa8\ub4e0 EW \ud45c\uc2dc\n  if(activeEW.length){\n    out+='<div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin:.8rem 0 .5rem\">EW Weapons</div>';\n    out+='<div class=\"wlist\">'+activeEW.map(ewWHTML).join('')+'</div>';\n  }\n  return out;\n}\n\n// \u2500\u2500 Engineering tab \u2500\u2500\nfunction engineeringHTML(s){\n  var out='';\n  if(s.engRating&&s.engRating!=='NotApplicable'){\n    out+='<div class=\"ratings-row\"><div class=\"rating-item\"><span class=\"rating-label\">Engineering</span><span class=\"rating '+ratingClass(s.engRating)+'\">'+s.engRating+'</span>';\n    if(s.engEff>0) out+='<span style=\"font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:2px\">'+Math.round(s.engEff*100)+'% eff</span>';\n    out+='</div></div>';\n  }\n  // Parts visual breakdown\n  if(s.partsT>0){\n    var partsM2=s.partsM||0;\n    var pOk=s.partsT-s.partsD-partsM2;\n    var pctD=s.partsT>0?s.partsD/s.partsT*100:0;\n    var pctM=s.partsT>0?partsM2/s.partsT*100:0;\n    var pctOk=100-pctD-pctM;\n    out+='<div style=\"margin-bottom:.9rem\">'\n      +'<div style=\"display:flex;justify-content:space-between;align-items:center;font-size:11px;font-family:var(--mono);color:var(--text3);margin-bottom:.45rem\">'\n      +'<span>Parts</span><span>'\n      +(s.partsD>0?'<span style=\"color:var(--text2)\">'+s.partsD+' dest</span><span style=\"color:var(--text3)\"> &middot; </span>':'')\n      +(partsM2>0?'<span style=\"color:var(--warn)\">'+partsM2+' dmg</span><span style=\"color:var(--text3)\"> &middot; </span>':'')\n      +'<span style=\"color:var(--alive)\">'+pOk+' ok</span><span style=\"color:var(--text3)\"> / '+s.partsT+'</span>'\n      +'</span></div>'\n      +'<div style=\"height:8px;border-radius:4px;overflow:hidden;background:var(--border);display:flex\">'\n      +(pctD>0?'<div style=\"width:'+pctD+'%;background:#4a4a56\"></div>':'')\n      +(pctM>0?'<div style=\"width:'+pctM+'%;background:var(--warn)\"></div>':'')\n      +(pctOk>0?'<div style=\"width:'+pctOk+'%;background:rgba(62,207,142,.6)\"></div>':'')\n      +'</div>'\n      +'<div style=\"display:flex;flex-wrap:wrap;gap:2px;margin-top:.4rem\">'\n      +Array(s.partsT).fill(0).map(function(_,i){\n        var c=i<s.partsD?'#4a4a56':i<s.partsD+partsM2?'var(--warn)':'rgba(62,207,142,.5)';\n        return '<div style=\"width:8px;height:8px;border-radius:1px;background:'+c+'\"></div>';\n      }).join('')\n      +'</div></div>';\n  }\n  var thrPct=Math.round(s.avgThruster*100);\n  var thrW=thrPct;\n  var crewSurvPct=s.crewO>0?Math.round(s.crewF/s.crewO*100):100;\n  var crewW=crewSurvPct;\n  out+='<div class=\"dgd\" style=\"grid-template-columns:repeat(3,1fr)\">'\n    +'<div class=\"ds\"><div class=\"dsl\">Crew survival</div><div class=\"dsv\" style=\"color:'+(crewW>80?'var(--alive)':crewW>50?'var(--warn)':'var(--dead)')+'\">'+crewSurvPct+'%</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Crew</div><div class=\"dsv-sm\">'+s.crewF+' / '+s.crewO+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Avg thruster</div><div class=\"dsv\" style=\"color:'+(thrW>60?'var(--alive)':thrW>30?'var(--warn)':'var(--dead)')+'\">'+thrPct+'%</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">DC teams</div><div class=\"dsv\">'+s.dcSurvived+' / '+s.dcCarried+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Restores used</div><div class=\"dsv\">'+s.restoresConsumed+' / '+s.restoresTotal+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Critical parts</div><div class=\"dsv\" style=\"color:'+(s.critComponents>0?'var(--warn)':'var(--text3)')+'\">'+s.critComponents+'</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Immobilized</div><div class=\"dsv\" style=\"color:'+(s.immobilized>0?'var(--warn)':'var(--text3)')+'\">'+s.immobilized+'s</div></div>'\n    +'<div class=\"ds\"><div class=\"dsl\">Distance</div><div class=\"dsv\">'+fmtN(s.distanceTravelled)+'m</div></div>'\n    +'</div>'\n    // Power section\n    +(s.optPower>0||s.avgPower>0?\n      '<div style=\"margin-top:.7rem\"><div style=\"font-size:11px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.45rem\">Power</div>'\n      +'<div class=\"dgd\" style=\"grid-template-columns:repeat(3,1fr)\">'\n      +'<div class=\"ds\"><div class=\"dsl\">Optimum power</div><div class=\"dsv-sm\">'+fmtN(s.optPower)+'</div></div>'\n      +'<div class=\"ds\"><div class=\"dsl\">Average power</div><div class=\"dsv-sm\" style=\"color:'+(s.avgPower<s.optPower*0.9?'var(--warn)':'var(--text)')+'\">'+fmtN(s.avgPower)+'</div></div>'\n      +(s.peakPowerDemand>0?'<div class=\"ds\"><div class=\"dsl\">Peak power</div><div class=\"dsv-sm\">'+fmtN(s.peakPowerDemand)+'</div></div>':'')\n      +'</div></div>'\n    :'');\n  return out;\n}\n\nfunction renderShips(team){\n  var container=document.getElementById('shipsContainer');\n  container.innerHTML='';\n  var allShips=[];\n  var players=team.players||[];\n  for(var pi=0;pi<players.length;pi++)\n    for(var si=0;si<players[pi].ships.length;si++) allShips.push(players[pi].ships[si]);\n  var maxDmg=0;\n  for(var i=0;i<allShips.length;i++){\n    if(allShips[i].dmgDealt>maxDmg) maxDmg=allShips[i].dmgDealt;\n    if(allShips[i].dmgRecv>maxDmg) maxDmg=allShips[i].dmgRecv;\n  }\n  if(maxDmg===0) maxDmg=1;\n\n  for(var pi2=0;pi2<players.length;pi2++){\n    var player=players[pi2];\n    var pTotalDmg=0;\n    for(var si2=0;si2<player.ships.length;si2++) pTotalDmg+=player.ships[si2].dmgDealt;\n    for(var ci=0;ci<player.crafts.length;ci++) pTotalDmg+=player.crafts[ci].dmgDealt;\n    var pHeader=document.createElement('div');\n    pHeader.className='player-group';\n    pHeader.innerHTML='<div class=\"player-header\"><span class=\"player-name\">'+player.name+(player.isLocal?' <span style=\"font-size:11px;color:var(--accent);font-family:var(--mono)\">[you]</span>':'')+'</span><span class=\"player-dmg\">&middot; '+player.ships.length+' ships &middot; '+fmtN(pTotalDmg)+' total dmg</span></div>';\n    var grid=document.createElement('div');\n    grid.className='ships-grid';\n    (function(ships){\n      for(var i=0;i<ships.length;i++){\n        (function(s){\n          var sc2=sColor(s.eliminated,s.defanged,s.condition,s.evacuated);\n          var sl2=sLabel(s.eliminated,s.defanged,s.condition,s.evacuated);\n          var fillPct=(s.dmgDealt/maxDmg*100).toFixed(1);\n          var elimInfo=s.eliminatedTime>0?' @ '+fmtT(s.eliminatedTime):'';\n          var dmgBreak='';\n          var activeGuns=s.gunWeapons; // \uc7a5\ucc29\ub41c \ubaa8\ub4e0 gun \ud45c\uc2dc\n          var activeMissiles=s.missiles.filter(function(m){return m.carried>0;}); // \uc7a5\ucc29\ub41c \ubbf8\uc0ac\uc77c \ud45c\uc2dc\n          var card=document.createElement('div');\n          card.className='sc';\n          var hullIcon=getHullIcon(s.hullKey);\n          var tintFilter,tintOpacity;\n          if(s.eliminated==='Destroyed'){tintFilter='sepia(1) saturate(15) hue-rotate(295deg)';tintOpacity='.45';}\n          else if(s.evacuated){tintFilter='sepia(1) saturate(4) hue-rotate(330deg)';tintOpacity='.6';}\n          else if(s.defanged){tintFilter='grayscale(1) brightness(1.2)';tintOpacity='.6';}\n          else if(s.condition>0&&s.condition<0.6){tintFilter='sepia(1) saturate(6) hue-rotate(330deg)';tintOpacity='.7';}\n          else{tintFilter='none';tintOpacity='.7';}\n          var iconStyle='height:32px;object-fit:contain;flex-shrink:0;pointer-events:none;min-width:50px;max-width:80px;opacity:'+tintOpacity+';filter:'+tintFilter+';';\n          var hullImgHtml=hullIcon?'<img src=\"'+hullIcon+'\" style=\"'+iconStyle+'\" alt=\"\">':'';\n          var sum=document.createElement('div');\n          sum.className='ssum';\n          sum.innerHTML='<span class=\"sdot\" style=\"background:'+sc2+'\"></span>'+hullImgHtml+'<div class=\"sinf\"><div class=\"snm\">'+s.name+'</div><div class=\"smt\">'+s.hull+' &middot; '+shortClass(s.hullKey)+' &middot; '+fmtN(s.pointCost)+' pts</div></div><div class=\"srht\"><div class=\"sdlt\" style=\"color:'+(s.dmgDealt>0?'var(--text)':'var(--text3)')+'\">'+fmtN(s.dmgDealt)+'</div>'+dmgBreak+'<div class=\"sdlb\" style=\"color:'+(s.dmgRecv>0?'rgba(232,92,74,.7)':'transparent')+'\">&#x2193; '+(s.dmgRecv>0?fmtN(s.dmgRecv):'0')+'</div>'\n          +'<div class=\"sst\" style=\"color:'+sc2+'\">'+sl2+elimInfo+'</div></div>';\n          // two bars: dealt (team color) and received (red)\n          var recvPct=(s.dmgRecv/maxDmg*100).toFixed(1);\n          var bar=document.createElement('div');\n          bar.className='dbar';\n          var gunPct=(s.gunDmg/maxDmg*100).toFixed(1);\n          var mslPctBar=(s.missileDmg/maxDmg*100).toFixed(1);\n          var recvPct=(s.dmgRecv/maxDmg*100).toFixed(1);\n          var repairW=s.dmgRecv>0?Math.min(s.dmgRepair,s.dmgRecv)/maxDmg*100:0;\n          bar.innerHTML=\n            // Bar 1: gun(white) stacked with msl(amber)\n            '<div class=\"dfil\"><div style=\"display:flex;height:100%\">'\n            +'<div style=\"width:'+gunPct+'%;background:rgba(255,255,255,.7);height:100%\"></div>'\n            +'<div style=\"width:'+mslPctBar+'%;background:rgba(245,166,35,.85);height:100%\"></div>'\n            +'</div></div>'\n            // Bar 2: recv(red) with repair shown as green from left\n            +'<div class=\"dfil\"><div style=\"position:relative;width:'+recvPct+'%;height:100%\">'\n            +'<div style=\"position:absolute;inset:0;background:rgba(232,92,74,.55)\"></div>'\n            +(s.dmgRepair>0?'<div style=\"position:absolute;left:0;top:0;height:100%;width:'+Math.min(100,parseFloat((repairW/Math.max(parseFloat(recvPct),.001)*100).toFixed(1)))+'%;background:rgba(62,207,142,.6)\"></div>':'')\n            +'</div></ 0);\n      var cftD=p.crafts.reduce(function(a,c){return a+c.dmgDealt;},0);\n      var pts=ss.reduce(function(a,s){return a+s.pointCost;},0);\n      var elim=ss.filter(function(s){return s.eliminated==='Destroyed';}).length;\n      var tr=document.createElement('tr');\n      tr.innerHTML='<td><span style=\"color:'+(t.id===(game.teams[0]?game.teams[0].id:'')?'var(--tA)':'var(--tB)')+';font-family:var(--mono);font-size:12px\">'+t.id+'</span></td>'\n        +'<td style=\"font-weight:500\">'+p.name+(p.isLocal?' <span style=\"font-size:11px;color:var(--accent);font-family:var(--mono)\">[you]</span>':'')+'</td>'\n        +'<td style=\"font-family:var(--mono)\">'+ss.length+'</td>'\n        +'<td style=\"font-family:var(--mono);color:var(--text2)\">'+fmtN(pts)+'</td>'\n        +'<td style=\"font-family:var(--mono);color:'+(gunD>0?'var(--text)':'var(--text3)')+'\">'+fmtN(gunD)+'</td>'\n        +'<td style=\"font-family:var(--mono);color:'+(mslD>0?'var(--warn)':'var(--text3)')+'\">'+fmtN(mslD)+'</td>'\n        +'<td style=\"font-family:var(--mono);color:'+(cftD>0?'var(--tB)':'var(--text3)')+'\">'+fmtN(cftD)+'</td>'\n        +'<td style=\"font-family:var(--mono);font-weight:600\">'+fmtN(gunD+mslD+cftD)+'</td>'\n        +'<td style=\"font-family:var(--mono);color:'+(elim>0?'var(--dead)':'var(--text3)')+'\">'+elim+'</td>';\n      tbody.appendChild(tr);\n    }\n  }\n}\n\n// Share\nvar _shareGame=null,_shareImageDataUrl=null;\nfunction buildShareCard(game,opts){\n  var hidePlayerNames=opts.hidePlayerNames,hideShipNames=opts.hideShipNames;\n  var hideDateTime=opts.hideDateTime;\n  function fN(n){return Math.round(n).toLocaleString('en-US');}\n  function fT(s){var m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0');}\n  function anonShip(s){return hideShipNames?'[REDACTED]':s;}\n  function anonMissile(name){\n    if(!opts.hideMissileNames) return name;\n    var parts=name.trim().split(/\\s+/);\n    return parts[0]+(parts.length>1?' [---]':'');\n  }\n  var tA=game.teams[0],t  Mono,monospace;text-transform:uppercase;letter-spacing:.08em\">Players</div><div style=\"flex-wrap:wrap\">'+pnamesHTML+'</div></div>':'')\n      +'<div class=\"rc-team-row\"><span>Total damage</span><span style=\"color:'+color+'\">'+fN(gunD+mslD+cD)+'</span></div>'\n      +'<div class=\"rc-team-row\"><span>&#x2937; Gun / Beam</span><span>'+fN(gunD)+'</span></div>'\n      +'<div class=\"rc-team-row\"><span>&#x2937; Missiles</span><span style=\"color:'+(mslD>0?'#f5a623':'#5a5a6a')+'\">'+fN(mslD)+'</span></div>'\n      +'<div class=\"rc-team-row\"><span>&#x2937; Strike Craft</span><span style=\"color:'+(cD>0?'#4ac4e8':'#5a5a6a')+'\">'+fN(cD)+'</span></div>'\n      +'<div class=\"rc-team-row\"><span>Dmg received</span><span>'+fN(recv)+'</span></div>'\n      +'<div class=\"rc-team-row\"><span>Repaired</span><span style=\"color:#3ecf8e\">'+fN(repair)+'</span></div>'\n      +'<div class=\"rc-team-row\"><span>Ships eliminated</span><span style=\"color:'+(elim>0?'#e85c4a':'#eeeef2')+'\">'+elim+' <span style=\"color:#5a5a6a\">/ '+ss.length+'</span></span></div>'\n      +'</div>';\n  }\n\n  function findPlayer(t,ship){\n    var ps=t?t.players||[]:[];\n    for(var i=0;i<ps.length;i++) for(var j=0;j<ps[i].ships.length;j++) if(ps[i].ships[j].name===ship.name) return ps[i].name;\n    return '';\n  }\n  var selP=opts.selectedPlayers&&opts.selectedPlayers.length?opts.selectedPlayers:null;\n  function playerAllowed(t,s){if(!selP)return true;var pname=findPlayer(t,s);return selP.indexOf(pname)>=0;}\n  // \ud300\ubcc4\ub85c \ubd84\ub9ac, \uac01\uac01 dmgDealt \ub0b4\ub9bc\ucc28\uc21c \uc815\ub82c, perTeam \uac1c\uc218 \uc81c\ud55c\n  var perTeam=opts.shipCount||12;\n  var shipsA=sA.filter(function(s){return playerAllowed(tA,s);}).map(function(s){return Object.assign({},s,{teamColor:'#4ac4e8',player:findPlayer(tA,s)});});\n  var shipsB=sB.filter(function(s){return playerAllowed(tB,s);}).map(function(s){return Object.assign({},s,{teamColor:'#e8763a',player:findPlayer(tB,s)});});\n  shipsA.sort(function(a,b){return b.dmgDealt-a.dmgDealt;});\n  shipsB.sort(function(a,b){return b.dmgDealt-a.dmgDealt;});\n  shipsA=shipsA.slice(0,perTeam);\n  shipsB=shipsB.slice(0,perTeam);\n  var allShips=shipsA.concat(shipsB);// for maxDmg calculation\n  var maxShareDmg=allShips.reduce(function(a,s){return Math.max(a,s.dmgDealt,s.dmgRecv);},1);\n\n  function teamHue(teamColor){\n    return teamColor==='#4ac4e8'\n      ?'invert(71%) sepia(52%) saturate(659%) hue-rotate(157deg) brightness(99%) contrast(88%)'\n      :'invert(59%) sepia(97%) saturate(467%) hue-rotate(338deg) brightness(100%) contrast(91%)';\n  }\n  function iconTint(s){\n    if(s.eliminated==='Destroyed') return 'opacity:.4;filter:sepia(1) saturate(15) hue-rotate(295deg);';\n    if(s.evacuated) return 'opacity:.55;filter:sepia(1) saturate(4) hue-rotate(350deg);';\n    if(s.defanged) return 'opacity:.5;filter:grayscale(1) brightness(1.2);';\n    if(s.condition>0&&s.condition<0.6) return 'opacity:.65;filter:sepia(1) saturate(6) hue-rotate(340deg);';\n    return 'opacity:.65;filter:'+teamHue(s.teamColor)+';';\n  }\n  function shipSc(s){\n    return s.eliminated==='Destroyed'?'#e85c4a':s.evacuated?'#e8763a':s.defanged?'#888898':s.condition>0&&s.condition<0.6?'#f5a623':'#3ecf8e';\n  }\n  function shipSl(s){\n    return s.eliminated==='Destroyed'?'Destroyed':s.evacuated?'Retired':s.defanged?'Defanged':s.condition>0&&s.condition<0.6?'Damaged':'Surviving';\n  }\n\n  function makeShipCell(s){\n    var sc=shipSc(s), sl=shipSl(s);\n    var barW=Math.round(s.dmgDealt/maxShareDmg*100);\n    var rci=getHullIcon(s.hullKey);\n    var rciHtml=rci?'<img src=\"'+rci+'\" style=\"height:18px;flex-shrink:0;margin-right:5px;'+iconTint(s)+'\" alt=\"\">':'';\n    var elimInfo=s.eliminatedTime>0?' @ '+fT(s.eliminatedTime):'';\n    var mslRows='';\n    if(s.missiles&&s.missiles.length){\n      var fired=s.missiles.filter(function(m){return m.dmg>0;});\n      fired.sort(function(a,b){return b.dmg-a.dmg;});\n      mslRows=fired.map(function(m){\n        var mslSeeker=parseMissileDesc(m.desc);\n        var mslLabel=anonMissile(m.name)+(mslSeeker?' <span style=\"color:#5a5a6a;font-size:9px\">'+mslSeeker+'</span>':'');\n        return '<div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:10px;margin-top:2px\">'\n          +'<span style=\"color:#eeeef2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">'+mslLabel+'</span>'\n          +'<span style=\"font-family:JetBrains Mono,monospace;color:#eeeef2;flex-shrink:0;margin-left:4px\">'+fN(m.dmg)+'</span>'\n          +'</div>';\n      }).join('');\n    }\n    return '<div style=\"background:#131316;border-radius:7px;padding:7px 10px;margin-bottom:5px;overflow:hidden\">'\n      +'<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:3px\">'\n      +'<div style=\"display:flex;align-items:center;min-width:0;overflow:hidden\">'+rciHtml\n      +'<div style=\"min-width:0;overflow:hidden\">'\n      +'<div style=\"font-size:12px;font-weight:600;color:'+s.teamColor+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+anonShip(s.name)+'</div>'\n      +'<div style=\"font-size:10px;color:#5a5a6a;font-family:JetBrains Mono,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+shortClass(s.hullKey)+(!hidePlayerNames?' &middot; '+s.player:'')+'</div>'\n      +'</div></div>'\n      +'<div style=\"text-align:right;flex-shrink:0;margin-left:6px\">'\n      +'<div style=\"font-size:12px;font-weight:700;font-family:JetBrains Mono,monospace;color:'+(s.dmgDealt>0?'#eeeef2':'#5a5a6a')+'\">'+fN(s.dmgDealt)+'</div>'\n      +'<div style=\"font-size:10px;font-family:JetBrains Mono,monospace;color:'+sc+'\">'+sl+elimInfo+'</div>'\n      +(s.dmgRecv>0?'<div style=\"font-size:10px;font-family:JetBrains Mono,monospace;color:rgba(232,92,74,.75);\">&#x2193; '+fN(s.dmgRecv)+'</div>':'')\n      +'</div></div>'\n      +mslRows\n      +'<div style=\"height:3px;background:#1a1a1f;border-radius:2px;margin-top:3px;overflow:hidden\"><div style=\"width:'+barW+'%;height:100%;background:rgba(255,255,255,.6)\"></div></div>'\n      +'<div style=\"height:3px;background:#1a1a1f;border-radius:2px;margin-top:2px;overflow:hidden\"><div style=\"width:'+Math.round(s.dmgRecv/maxShareDmg*100)+'%;height:100%;background:rgba(232,92,74,.5)\"></div></div>'\n      +'</div>';\n  }\n\n  // \ud300 A \uc67c\ucabd, \ud300 B \uc624\ub978\ucabd \u2014 \uac01 \uceec\ub7fc\uc774 \ub3c5\ub9bd\uc801\uc73c\ub85c \uc313\uc784\n  // \uce74\ub4dc \ud3ed \uace0\uc815: overflow:hidden + min-width:0 \uc73c\ub85c \uae34 \uc774\ub984\uc774 \uceec\ub7fc \ud3ed\uc744 \ubc14\uafb8\uc9c0 \uc54a\ub3c4\ub85d\n  var colA=shipsA.map(makeShipCell).join('');\n  var colB=shipsB.map(makeShipCell).join('');\n  var shipGrid='<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start\">'\n    +'<div style=\"min-width:0;overflow:hidden\">'\n    +'<div style=\"font-size:10px;font-family:JetBrains Mono,monospace;color:#4ac4e8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px\">'+(tA?tA.id:'Team A')+' &mdash; sorted by dmg dealt</div>'\n    +colA\n    +'</div>'\n    +'<div style=\"min-width:0;overflow:hidden\">'\n    +'<div style=\"font-size:10px;font-family:JetBrains Mono,monospace;color:#e8763a;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px\">'+(tB?tB.id:'Team B')+' &mdash; sorted by dmg dealt</div>'\n    +colB\n    +'</div>'\n    +'</div>';\n\n  // craft summary per team \u2014 \ud300\ubcc4 \uceec\ub7fc \uad6c\uc870\ub85c \ud1b5\ud569, align-items:start \ub85c \ub192\uc774 \uace0\uc815 \ud574\uc81c\n  function craftSummaryHTML(t,teamColor){\n    var ps=t?t.players||[]:[];\n    var rows='';\n    for(var pi=0;pi<ps.length;pi++){\n      var p=ps[pi];\n      if(selP&&selP.indexOf(p.name)<0) continue;\n      for(var ci=0;ci<p.crafts.length;ci++){\n        var c=p.crafts[ci];\n        if(c.sorties===0&&c.dmgDealt===0) continue;\n        var cico=getCraftIcon(c.name,c.frame);\n        var ciHtml=cico?'<img src=\"'+cico+'\" style=\"height:14px;opacity:.65;margin-right:5px;flex-shrink:0;filter:'+teamHue(teamColor)+';\" alt=\"\">':'';\n        var craftName=opts.hideCraftNames?(function(n){var p2=n.trim().split(/\\s+/);return p2[0]+(p2.length>1?' [---]':'');})(c.name):c.name;\n        var allW=c.strikeWeapons.concat(c.ssWeapons);\n        var activeW=allW.filter(function(w){return w.carried>0||w.rounds>0||(w.sortied||0)>0||w.shots>0||w.dmg>0;});\n        var wRows=activeW.slice(0,2).map(function(w){\n          var isMissile=w.type.indexOf('Missile')>=0||w.type.indexOf('Craft')>=0;\n          var wName=opts.hideMissileNames&&isMissile?(function(n){var p3=n.trim().split(/\\s+/);return p3[0]+(p3.length>1?' [---]':'');})(w.name):w.name;\n          var wSeeker=isMissile?parseMissileDesc(w.desc||''):'';\n          var wDmg=w.dmg>0?fN(w.dmg):'\u2014';\n          var wLabel=wName+(wSeeker?' <span style=\"color:#5a5a6a;font-size:8px\">'+wSeeker+'</span>':'');\n          return '<div style=\"display:flex;justify-content:space-between;align-items:baseline;font-size:9px;margin-top:1px;overflow:hidden\">'\n            +'<span style=\"color:#eeeef2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0\">'+wLabel+'</span>'\n            +'<span style=\"font-family:JetBrains Mono,monospace;color:#eeeef2;flex-shrink:0;margin-left:4px\">'+wDmg+'</span>'\n            +'</div>';\n        }).join('');\n        rows+='<div style=\"background:#131316;border-radius:6px;padding:6px 10px;margin-bottom:4px;overflow:hidden\">'\n          +'<div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:'+(wRows?'3px':'0')+';\">'\n          +'<div style=\"display:flex;align-items:center;min-width:0;overflow:hidden\">'+ciHtml\n          +'<div style=\"min-width:0;overflow:hidden\">'\n          +'<div style=\"font-size:11px;font-weight:600;color:'+teamColor+';white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">'+craftName+'</div>'\n          +'<div style=\"font-size:9px;color:#5a5a6a;white-space:nowrap\">'+c.sorties+' sorties &middot; '+c.lost+'/'+c.carried+' lost</div>'\n          +'</div></div>'\n          +'<div style=\"text-align:right;font-family:JetBrains Mono,monospace;font-size:11px;font-weight:700;flex-shrink:0;margin-left:6px;color:'+(c.dmgDealt>0?teamColor:'#5a5a6a')+'\">'+fN(c.dmgDealt)+'</div>'\n          +'</div>'\n          +wRows\n          +'</div>';\n      }\n    }\n    return rows;\n  }\n\n  var craftRowsA=craftSummaryHTML(tA,'#4ac4e8');\n  var craftRowsB=craftSummaryHTML(tB,'#e8763a');\n  var craftSection=(craftRowsA||craftRowsB)\n    ?'<div style=\"margin-top:14px\"><div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start\">'\n    +'<div style=\"min-width:0;overflow:hidden\">'\n    +'<div style=\"font-size:10px;font-family:JetBrains Mono,monospace;color:#4ac4e8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px\">Strike Craft &mdash; '+(tA?tA.id:'A')+'</div>'\n    +craftRowsA\n    +'</div>'\n    +'<div style=\"min-width:0;overflow:hidden\">'\n    +'<div style=\"font-size:10px;font-family:JetBrains Mono,monospace;color:#e8763a;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px\">Strike Craft &mdash; '+(tB?tB.id:'B')+'</div>'\n    +craftRowsB\n    +'</div>'\n    +'</div></div>'\n    :'';\n\n  return '<div class=\"rc-wrap\">'\n    +'<div class=\"rc-header\"><div>'\n    +'<div class=\"rc-logo\">NEBULOUS<span> // </span>FLEET COMMAND</div>'\n    +'<div class=\"rc-title\">Skirmish Report</div>'\n    +'<div class=\"rc-date\">'+matchDate+'</div></div>'\n    +'<div><div class=\"rc-winner-label\">'+winnerHeading+'</div><div style=\"text-align:right\"><span class=\"rc-winner-badge\" style=\"background:'+winnerBg+';color:'+winnerColor+'\">'+winnerLabel+'</span></div><div class=\"rc-winner-sub\">'+fT(game.duration)+' &middot; '+(elimA+elimB)+' / '+(sA.length+sB.length)+' ships lost</div></div></div>'\n    +'<div class=\"rc-strip\">'\n    +'<div class=\"rc-stat\"><div class=\"rc-stat-label\">Duration</div><div class=\"rc-stat-val\">'+fT(game.duration)+'</div></div>'\n    +'<div class=\"rc-stat\"><div class=\"rc-stat-label\" style=\"color:#4ac4e8\">Team A lost</div><div class=\"rc-stat-val\" style=\"color:'+(elimA>0?'#e85c4a':'#eeeef2')+'\">'+elimA+' <span style=\"font-size:14px;color:#5a5a6a\">/ '+sA.length+'</span></div></div>'\n    +'<div class=\"rc-stat\"><div class=\"rc-stat-label\" style=\"color:#e8763a\">Team B lost</div><div class=\"rc-stat-val\" style=\"color:'+(elimB>0?'#e85c4a':'#eeeef2')+'\">'+elimB+' <span style=\"font-size:14px;color:#5a5a6a\">/ '+sB.length+'</span></div></div>'\n    +'<div class=\"rc-stat\"><div class=\"rc-stat-label\">Total pts</div><div class=\"rc-stat-val\">'+fN(sA.concat(sB).reduce(function(a,s){return a+s.pointCost;},0))+'</div></div>'\n    +'</div>'\n    +'<div class=\"rc-teams\">'+teamBlock(tA,'a','#4ac4e8')+teamBlock(tB,'b','#e8763a')+'</div>'\n    +shipGrid\n    +craftSection\n    +'<div class=\"rc-footer\"><div class=\"rc-footer-left\">Nebulous: Fleet Command'+(hidePlayerNames?' &middot; Players redacted':'')+(hideShipNames?' &middot; Ships redacted':'')+(hideDateTime?' &middot; Date hidden':'')+'</div><div class=\"rc-footer-right\">SKIRMISH REPORT VIEWER</div></div>'\n    +'</div>';\n}\n\nfunction openShareModal(){\n  document.getElementById('shareModal').classList.add('open');\n  document.getElementById('sharePreviewImg').style.display='none';\n  document.getElementById('sharePlaceholder').style.display='block';\n  document.getElementById('shareDownloadBtn').disabled=true;\n  _shareImageDataUrl=null;\n  // Build player checkboxes\n  var list=document.getElementById('sharePlayerList');\n  if(list&&_shareGame){\n    list.innerHTML='';\n    var allPlayers=[];\n    for(var ti=0;ti<_shareGame.teams.length;ti++){\n      var t=_shareGame.teams[ti];\n      var tc=ti===0?'var(--tA)':'var(--tB)';\n      for(var pi=0;pi<t.players.length;pi++){\n        var p=t.players[pi];\n        var cb=document.createElement('label');\n        cb.className='privacy-opt';\n        cb.innerHTML='<input type=\"checkbox\" class=\"share-player-cb\" value=\"'+p.name+'\" checked>'\n          +'<span class=\"privacy-check\"></span>'\n          +'<span style=\"font-size:12px;color:'+tc+'\">'+p.name+'</span>';\n        list.appendChild(cb);\n      }\n    }\n  }\n}\nfunction closeShareModal(){document.getElementById('shareModal').classList.remove('open');}\nfunction generateShareImage(){\n  if(!_shareGame)return;\n  var selectedPlayers=Array.from(document.querySelectorAll('.share-player-cb:checked')).map(function(e){return e.value;});\n  var scEl=document.getElementById('shareShipCount');var opts={hidePlayerNames:document.getElementById('hidePlayerNames').checked,hideShipNames:document.getElementById('hideShipNames').checked,hideMissileNames:document.getElementById('hideMissileNames').checked,hideCraftNames:document.getElementById('hideCraftNames').checked,hideDateTime:document.getElementById('hideDateTime').checked,shipCount:scEl?parseInt(scEl.value):12,selectedPlayers:selectedPlayers};\n  document.getElementById('shareGenerating').classList.add('show');\n  document.getElementById('shareGenBtn').disabled=true;\n  var card=document.getElementById('shareCard');\n  card.innerHTML=buildShareCard(_shareGame,opts);\n  setTimeout(function(){\n    html2canvas(card,{backgroundColor:'#0c0c0e',scale:2,useCORS:true,logging:false,width:800}).then(function(canvas){\n      _shareImageDataUrl=canvas.toDataURL('image/png');\n      var img=document.getElementById('sharePreviewImg');\n      img.src=_shareImageDataUrl;img.style.display='block';\n      document.getElementById('sharePlaceholder').style.display='none';\n      document.getElementById('shareDownloadBtn').disabled=false;\n      document.getElementById('shareGenerating').classList.remove('show');\n      document.getElementById('shareGenBtn').disabled=false;\n    }).catch(function(e){alert('Render error: '+e.message);document.getElementById('shareGenerating').classList.remove('show');document.getElementById('shareGenBtn').disabled=false;});\n  },200);\n}\nfunction downloadShareImage(){\n  if(!_shareImageDataUrl)return;\n  var a=document.createElement('a');\n  var ts=_shareGame&&_shareGame.time?new Date(_shareGame.time).toISOString().slice(0,10):'report';\n  a.download='skirmish-report-'+ts+'.png';a.href=_shareImageDataUrl;a.click();\n}\ndocument.addEventListener('change',function(e){\n  if(e.target&&e.target.classList.contains('share-player-cb')){\n    if(_shareImageDataUrl){\n      document.getElementById('sharePreviewImg').style.display='none';\n      document.getElementById('sharePlaceholder').style.display='block';\n      document.getElementById('shareDownloadBtn').disabled=true;\n      _shareImageDataUrl=null;\n    }\n  }\n});\nvar shareShipCountEl=document.getElementById('shareShipCount');\nvar shareShipCountValEl=document.getElementById('shareShipCountVal');\nif(shareShipCountEl){\n  shareShipCountEl.addEventListener('input',function(){\n    shareShipCountValEl.textContent=shareShipCountEl.value;\n    if(_shareImageDataUrl){\n      document.getElementById('sharePreviewImg').style.display='none';\n      document.getElementById('sharePlaceholder').style.display='block';\n      document.getElementById('shareDownloadBtn').disabled=true;\n      _shareImageDataUrl=null;\n    }\n  });\n}\ndocument.querySelectorAll('.privacy-opt input').forEach(function(el){\n  el.addEventListener('change',function(){if(_shareImageDataUrl){document.getElementById('sharePreviewImg').style.display='none';document.getElementById('sharePlaceholder').style.display='block';document.getElementById('shareDownloadBtn').disabled=true;_shareImageDataUrl=null;}});\n});\nfunction loadXML(text){try{render(parseAAR(text));}catch(e){alert('Parse error: '+e.message);console.error(e);}}\nfunction reset(){\n  document.getElementById('dropZone').style.display='block';\n  document.getElementById('dashboard').style.display='none';\n  document.getElementById('resetBtn').style.display='none';\n  document.getElementById('shareBtn').style.display='none';\n  charts.forEach(function(c){c.destroy();});charts=[];\n  _shareGame=null;_shareImageDataUrl=null;\n}\ndocument.getElementById('fileInput').addEventListener('change',function(e){\n  var f=e.target.files[0];if(!f)return;\n  var r=new FileReader();r.onload=function(ev){loadXML(ev.target.result);};r.readAsText(f,'UTF-8');e.target.value='';\n});\nvar dz=document.getElementById('dropZone');\ndz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag');});\ndz.addEventListener('dragleave',function(){dz.classList.remove('drag');});\ndz.addEventListener('drop',function(e){\n  e.preventDefault();dz.classList.remove('drag');\n  var f=e.dataTransfer.files[0];if(!f)return;\n  var r=new FileReader();r.onload=function(ev){loadXML(ev.target.result);};r.readAsText(f,'UTF-8');\n});\n\n<\/script>\n</body>\n</html>";

var loaded = { fleet: false, aar: false };
var HTML_BY_TAB = { fleet: FLEET_VIEWER_HTML, aar: AAR_VIEWER_HTML };

function ensureLoaded(name){
  if(loaded[name]) return;
  var iframe = document.getElementById('iframe-'+name);
  iframe.addEventListener('load', function onLoad(){
    var loadingEl = document.getElementById('loading-'+name);
    if(loadingEl) loadingEl.style.display = 'none';
    iframe.removeEventListener('load', onLoad);
    if(name === 'fleet' && window.__pendingSharedId){
      iframe.contentWindow.postMessage({ type: 'nebulous-fleet-load-id', id: window.__pendingSharedId }, '*');
      window.__pendingSharedId = null;
    }
  });
  iframe.srcdoc = HTML_BY_TAB[name];
  loaded[name] = true;
}

function activateTab(name){
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab === name); });
  document.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.toggle('active', p.id === 'pane-'+name); });
  ensureLoaded(name);
}

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ activateTab(btn.dataset.tab); });
});

// If this combined page itself was opened with ?id=..., land on the Fleet
// tab and hand the id to that iframe once it finishes loading (the fleet
// viewer also tries reading the parent URL directly; this postMessage is
// a robust fallback either way).
var params = new URLSearchParams(window.location.search);
var sharedId = params.get('id');
if(sharedId) window.__pendingSharedId = sharedId;

activateTab('fleet');
</script>
