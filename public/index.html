<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0c0c0e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
#tabBar{display:flex;align-items:center;gap:4px;padding:.6rem .8rem;background:#131316;border-bottom:1px solid #28282f;flex-shrink:0}
.tab-btn{padding:.5rem 1.1rem;border:1px solid transparent;border-radius:7px;background:transparent;color:#9898a8;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.tab-btn:hover{color:#eeeef2;background:#1a1a1f}
.tab-btn.active{color:#eeeef2;background:#1a1a1f;border-color:#38383f}
#tabContent{flex:1;position:relative;min-height:0}
.tab-pane{position:absolute;inset:0;display:none}

\n.logo span{color:var(--text3)}\nh1{font-size:16px;font-weight:600;letter-spacing:-.01em}\n.hdr-btn{display:none;padding:.38rem 1rem;border:1px solid var(--border2);border-radius:6px;background:transparent;color:var(--text2);font-size:13px;cursor:pointer;transition:all .15s;font-family:inherit}\n.hdr-btn:hover{border-color:var(--text2);color:var(--text)}\n\n#dropZone{margin:3rem 2rem;border:1.5px dashed var(--border2);border-radius:14px;padding:5rem 2rem;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}\n#dropZone::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,rgba(124,108,250,.07) 0%,transparent 70%);pointer-events:none}\n#dropZone:hover,#dropZone.drag{border-color:var(--accent);background:rgba(124,108,250,.035)}\n.di{font-size:2.2rem;margin-bottom:.9rem;opacity:.3}\n.dt{font-size:1.3rem;font-weight:600;margin-bottom:.4rem;letter-spacing:-.01em}\n.ds2{font-size:13px;color:var(--text2);font-family:var(--mono)}\n#fileInput{display:none}\n.db{display:inline-block;margin-top:1.3rem;padding:.48rem 1.3rem;border:1px solid var(--accent);border-radius:7px;color:var(--accent);font-size:13px;cursor:pointer;transition:all .15s}\n.db:hover{background:var(--accent);color:#fff}\n\n#dashboard{display:none;padding:0 2rem 6rem}\n@media(max-width:500px){#dashboard{padding:0 .75rem 5rem}}\n.section{margin-bottom:2rem}\n.sh{font-size:11px;font-family:var(--mono);color:var(--text3);letter-spacing:.14em;text-transform:uppercase;padding:.35rem 0;margin-bottom:1rem;border-bottom:1px solid var(--border)}\n\n/* ---- banner / stat strip (no icons, mirrors reference's bp/bl/bv pattern) ---- */\n.banner{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.2rem 1.6rem;margin:1.4rem 0 1.6rem;display:flex;flex-direction:column;gap:.9rem}\n.banner h2{font-size:19px;font-weight:600;letter-spacing:-.01em}\n.stat-strip{display:flex;flex-wrap:wrap;gap:0}\n.sst{display:flex;flex-direction:column;gap:3px;padding:0 1.4rem;border-left:1px solid var(--border)}\n.sst:first-child{padding-left:0;border-left:none}\n.sst-l{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.1em}\n.sst-v{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}\n.faction-v{display:flex;align-items:center;gap:8px}\n.faction-icon{display:inline-block;height:26px;width:26px;background-size:contain;background-repeat:no-repeat;background-position:center;flex-shrink:0}\n.bdesc{color:var(--text2);font-size:13px;white-space:pre-wrap;line-height:1.6;max-width:900px}\n.fleet-icons{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}\n.fi-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;flex-shrink:0}\n.fi-icon{display:inline-block;height:38px;width:58px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.9}\n.fi-icon-ph{height:38px;width:58px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:18px}\n.fi-label{font-size:9.5px;font-family:var(--mono);color:var(--text3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58px}\n\n/* ---- ship cards (socket/slot based) ---- */\n.ships-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(440px,100%),1fr));gap:8px}\n.sc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .15s}\n.sc:hover{border-color:var(--border2)}\n.sc.open{border-color:var(--border2)}\n.ssum{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;cursor:pointer;user-select:none}\n.hull-icon{display:inline-block;height:34px;width:66px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.85;flex-shrink:0;pointer-events:none}\n.hull-icon-ph{height:34px;min-width:52px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px;flex-shrink:0}\n.sinf{flex:1;min-width:0}\n.snm{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}\n.snm .snm-name{color:var(--text);font-weight:600}\n.smt{font-size:12px;font-family:var(--mono);color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.srht{text-align:right;flex-shrink:0}\n.scost{font-size:15px;font-weight:700;font-family:var(--mono);color:#e8c04e}\n.scount{font-size:11px;font-family:var(--mono);color:var(--text3);margin-top:1px}\n.chev{color:var(--text3);font-size:11px;flex-shrink:0;transition:transform .15s}\n.sc.open .chev{transform:rotate(90deg)}\n\n.sdet{display:none;border-top:1px solid var(--border);padding:.6rem .8rem .7rem}\n.sc.open .sdet{display:block}\n.slot-group{margin-bottom:10px;break-inside:avoid-column}\n.sdet-2col{column-count:2;column-gap:20px}\n.slot-group:last-child{margin-bottom:0}\n.slot-group-hd{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.15rem}\n.slot-list{display:flex;flex-direction:column}\n.slot-row{display:flex;align-items:baseline;gap:8px;padding:.22rem .1rem;border-top:1px solid var(--bg4)}\n.slot-row:first-child{border-top:none}\n.slot-num{font-family:var(--mono);font-size:10px;color:var(--text3);width:30px;flex-shrink:0;text-align:right;letter-spacing:-.02em}\n.slot-dot{width:6px;height:6px;border-radius:2px;flex-shrink:0;align-self:center}\n.slot-body{flex:1;min-width:0}\n.slot-name{font-size:12px;color:var(--text);line-height:1.3}\n.slot-name.is-empty{color:var(--text3);font-style:italic}\n.loadrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}\n.load-tag{background:var(--bg4);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-size:10.5px;font-family:var(--mono);display:inline-flex;align-items:center;gap:4px}\n.load-tag b{color:var(--launcher);font-weight:700}\n.craft-tag{background:var(--bg4);border:1px solid var(--border);border-radius:5px;padding:1px 6px 1px 3px;font-size:10.5px;display:inline-flex;align-items:center;gap:4px}\n.craft-tag .ctIcon{display:inline-block;height:13px;width:13px;background-size:contain;background-repeat:no-repeat;background-position:center;flex-shrink:0}\n.craft-tag .ctb{color:var(--hangar);font-weight:700;font-family:var(--mono)}\n.craft-tag .ctc{color:var(--hangar);font-weight:700;font-family:var(--mono)}\n.craft-tag .ctm{color:var(--text2)}\n.craft-tag .cts{color:var(--text3);font-size:10px}\n\n/* ---- template cards (missiles / craft) ---- */\n.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:8px}\n.tplc{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.9rem 1.1rem}\n.tplc-hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}\n.tpl-dg{font-size:14px;font-weight:700;font-family:var(--mono);letter-spacing:.02em}\n.tpl-dg.msl{color:var(--launcher)}\n.tpl-dg.craft{color:var(--hangar)}\n.tpl-nn{font-size:12px;color:var(--text2);font-weight:500}\n.tpl-cost{font-size:12px;font-family:var(--mono);color:#e8c04e;font-weight:600;flex-shrink:0}\n.tpl-body{font-size:10.5px;color:var(--text3);font-family:var(--mono);margin-top:1px}\n.tpl-avio{font-size:12px;font-family:var(--mono);color:var(--text2);margin:.5rem 0 .7rem;line-height:1.6;word-break:break-word}\n.stat-section{margin-top:.6rem}\n.stat-section:first-of-type{margin-top:.5rem}\n.stat-section-hd{font-size:10px;font-family:var(--mono);color:var(--text3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:.35rem}\n.comp-rows{display:flex;flex-direction:column;gap:2px}\n.comp-row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:.18rem 0;border-top:1px solid var(--bg4)}\n.comp-row .cr-k{color:var(--text3);font-family:var(--mono)}\n.comp-row .cr-v{color:var(--text);text-align:right}\n.loadout-row{margin-bottom:.45rem}\n.loadout-row:last-child{margin-bottom:0}\n.lo-name{font-size:11px;font-family:var(--mono);color:var(--text2);font-weight:600}\n.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}\n.stat{display:flex;justify-content:space-between;gap:6px;border-top:1px solid var(--bg4);padding:.2rem 0;font-size:11.5px}\n.stat .k{color:var(--text3);font-family:var(--mono)}\n.stat .v{color:var(--text);font-weight:500;font-family:var(--mono);text-align:right}\n.stage-note{font-size:10.5px;color:var(--text3);font-style:italic;margin-top:.4rem}\n.tplc-icon{display:flex;align-items:center;gap:8px;margin-bottom:.3rem}\n.tplc-icon .tpIcon{display:inline-block;height:24px;width:24px;background-size:contain;background-repeat:no-repeat;background-position:center;opacity:.85}\n\n/* ---- share button + modal (mirrors reference tool) ---- */\n.share-btn-row{display:none;position:fixed;bottom:1.5rem;right:1.5rem;gap:.6rem;z-index:50}\n.share-btn-row.show{display:flex}\n.share-btn{padding:.6rem 1.2rem;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-family:var(--sans);font-weight:600;cursor:pointer;box-shadow:0 4px 20px rgba(124,108,250,.4);transition:all .15s;white-space:nowrap}\n.share-btn:hover{background:#6a5ce8;transform:translateY(-1px)}\n.share-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:1rem}\n.share-modal.open{display:flex}\n.share-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:560px;overflow:hidden;position:relative;max-height:90vh;display:flex;flex-direction:column}\n.share-box-head{padding:1.2rem 1.4rem .9rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}\n.share-box-title{font-size:15px;font-weight:600;letter-spacing:-.01em}\n.share-close{background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;line-height:1;padding:.2rem;transition:color .12s}\n.share-close:hover{color:var(--text)}\n.share-body{padding:1.2rem 1.4rem;overflow-y:auto;flex:1}\n.share-preview-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1.1rem;min-height:80px;display:flex;align-items:center;justify-content:center}\n.share-preview-img{width:100%;display:block;border-radius:9px}\n.share-preview-placeholder{font-size:12px;font-family:var(--mono);color:var(--text3);padding:2rem;text-align:center}\n.share-actions{display:flex;gap:8px}\n.share-action-btn{flex:1;padding:.6rem;border-radius:8px;border:1px solid var(--border2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;color:var(--text);font-family:inherit}\n.share-action-btn:hover{border-color:var(--text2)}\n.share-action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}\n.share-action-btn.primary:hover{background:#6a5ce8;border-color:#6a5ce8}\n.share-action-btn:disabled{opacity:.45;cursor:not-allowed}\n.share-generating{display:none;position:absolute;inset:0;background:rgba(12,12,14,.7);border-radius:15px;align-items:center;justify-content:center;flex-direction:column;gap:.7rem;font-size:13px;font-family:var(--mono);color:var(--text2)}\n.share-generating.show{display:flex}\n.spinner{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--border2);border-top-color:var(--accent);animation:spin .7s linear infinite}\n@keyframes spin{to{transform:rotate(360deg)}}\n#shareCard{position:fixed;left:-9999px;top:0;width:960px;background:#0c0c0e;font-family:'Inter',sans-serif;color:#eeeef2;overflow:hidden}\n.rc-wrap{padding:28px 32px 32px}\n.rc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #28282f}\n.rc-logo{font-size:10px;font-family:'JetBrains Mono',monospace;color:#7c6cfa;letter-spacing:.18e ce;color:#5a5a6a}\n.rc-footer-right{font-size:10px;font-family:'JetBrains Mono',monospace;color:#38383f;letter-spacing:.06em}\n\nfooter{margin-top:50px;color:var(--text3);font-size:12px;text-align:center;padding-bottom:2rem}\n.fade-in{animation:fadeIn .22s ease both}\n@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}\n</style>\n</head>\n<body>\n<header>\n  <div><div class=\"logo\">NEBULOUS<span> // </span>FLEET COMMAND</div><h1>Fleet Loadout Viewer</h1></div>\n  <div id=\"headerBtns\" style=\"display:flex;gap:8px\">\n    <button id=\"downloadBtn\" class=\"hdr-btn\" onclick=\"downloadFleetFile()\">&#x2B73; Download File</button>\n    <button id=\"resetBtn\" class=\"hdr-btn\" onclick=\"resetAll()\">&#x21A9; Load different file</button>\n  </div>\n</header>\n\n<div id=\"dropZone\" onclick=\"document.getElementById('fileInput').click()\">\n  <div class=\"di\">&#x2B21;</div>\n  <div class=\"dt\">Drop your .fleet file here</div>\n  <div class=\"ds2\">*.fleet &nbsp;&middot;&nbsp; drag &amp; drop or click to browse</div>\n  <label class=\"db\">Browse file</label>\n  <input type=\"file\" id=\"fileInput\" accept=\".fleet\">\n</div>\n\n<div id=\"dashboard\">\n  <div id=\"fleetView\"></div>\n</div>\n\n<div class=\"share-btn-row\" id=\"shareBtnRow\">\n  <button class=\"share-btn\" id=\"shareLinkBtn\" onclick=\"openLinkModal()\">Share Link</button>\n  <button class=\"share-btn\" id=\"shareBtn\" onclick=\"openShareModal()\">Share as Image</button>\n</div>\n<div class=\"share-modal\" id=\"linkModal\" onclick=\"if(event.target===this)closeLinkModal()\">\n  <div class=\"share-box\">\n    <div class=\"share-box-head\">\n      <span class=\"share-box-title\">Share via Link</span>\n      <button class=\"share-close\" onclick=\"closeLinkModal()\">&#x2715;</button>\n    </div>\n    <div class=\"share-body\">\n      <div id=\"linkPreArea\">\n        <div style=\"font-size:12.5px;color:var(--text2);line-height:1.6;margin-bottom:1rem\">\n          Uploads this fleet file so anyone with the link can open and view it &mdash; no account needed on their end.\n        </div>\n        <button class=\"share-action-btn primary\" id=\"linkGenBtn\" onclick=\"generateShareLink()\" style=\"width:100%\">&#x25B6; Generate Link</button>\n      </div>\n      <div id=\"linkResultArea\" style=\"display:none\">\n        <div id=\"linkResultLabel\" style=\"font-size:12px;color:var(--text3);margin-bottom:.5rem\">Anyone with this link can view the fleet:</div>\n        <div style=\"display:flex;gap:6px\">\n          <input type=\"text\" id=\"linkResultInput\" readonly style=\"flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:7px;padding:.5rem .7rem;color:var(--text);font-family:var(--mono);font-size:12px\">\n          <button class=\"share-action-btn primary\" onclick=\"copyShareLink()\" style=\"flex:0 0 auto;padding:.5rem .9rem\">Copy</button>\n        </div>\n      </div>\n    </div>\n    <div class=\"share-generating\" id=\"linkGenerating\"><div class=\"spinner\"></div><span>Uploading...</span></div>\n  </div>\n</div>\n<div class=\"share-modal\" id=\"shareModal\" onclick=\"if(event.target===this)closeShareModal()\">\n  <div class=\"share-box\">\n    <div class=\"share-box-head\">\n      <span class=\"share-box-title\">Share Fleet</span>\n      <button class=\"share-close\" onclick=\"closeShareModal()\">&#x2715;</button>\n    </div>\n    <div class=\"share-body\">\n      <div class=\"share-preview-wrap\" id=\"sharePreviewWrap\">\n        <div class=\"share-preview-placeholder\" id=\"sharePlaceholder\">Click \"Generate Preview\" to render</div>\n        <img id=\"sharePreviewImg\" class=\"share-preview-img\" style=\"display:none\" alt=\"preview\">\n      </div>\n      <div class=\"share-actions\">\n        <button class=\"share-action-btn\" id=\"shareGenBtn\" onclick=\"generateShareImage()\">&#x25B6; Generate Preview</button>\n        <button class=\"share-action-btn primary\" id=\"shareDownloadBtn\" =================\n   TEXT DECODING HELPERS\n   ============================================================ */\nfunction esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }\n\n/* Render an icon as a background-image span rather than an <img> with\n   object-fit. html2canvas (used for \"Share as Image\") doesn't reliably\n   respect object-fit on <img> elements and stretches them to fill their\n   box instead of preserving aspect ratio, causing distorted icons in the\n   shared image. background-image + background-size:contain works\n   correctly in both the live page and html2canvas captures. */\nfunction iconSpan(src, cls, extraStyle){\n  if(!src) return '';\n  var style = \"background-image:url('\"+src+\"')\"+(extraStyle?';'+extraStyle:'');\n  return '<span class=\"'+cls+'\" style=\"'+style+'\"></span>';\n}\n\nfunction cleanKey(k){\n  if(!k) return '';\n  k = k.replace(/^\\$?[A-Z]+\\$?\\//,'');\n  k = k.replace(/^Stock\\//,'');\n  k = k.trim();\n  return COMPONENT_NAME_FIXES[k] || k;\n}\n\n/* Some stock components' saved ComponentName omits the in-game flavor\n   name that the game itself displays (e.g. the file just says \"P11\n   PDT\" with no name, unlike \"Mk20 Defender PDT\" which already includes\n   one). Patch the ones we know about. */\nvar COMPONENT_NAME_FIXES = {\n  'P11 PDT': \"P11 'Pavise' PDT\",\n  'P20 PDT': \"P20 'Bastion' PDT\",\n  'P20 Flak PDT': \"P20 'Bastion' PDT\",\n  'P60 PDT': \"P60 'Grazer' PDT\",\n  'E20 Illuminator': \"E20 'Lighthouse' Illuminator\",\n  'J15 Jammer': \"J15 'Bellbird' Jammer\",\n  'J360 Jammer': \"J360 'Lyrebird' Jammer\",\n  'J75 Jammer': \"J75 'Warbler' Jammer\",\n  'L50 Laser Dazzler': \"L50 'Blackjack' Laser Dazzler\",\n  'R400 Radar': \"R400 'Bloodhound' LRT Radar\",\n  'S1 Rocket': \"R-1 'Perch' Rocket\",\n  'S0 Rocket': \"R-2 'Piranha' Rocket\",\n  'S3 Rocket': \"R-3 'Spearfish' Rocket\",\n  'S1 Glide Bomb': \"KBU-15 Bomb\",\n  'S2 Glide Bomb': \"KBU-22 Bomb\",\n  'S3 Cluster Bomb': \"CBU-40 Cluster Bomb\",\n  'S1 Prox Bomb': \"FBU-15 Fragmentation Bomb\"\n};\n\nfunction decodeGameText(s){\n  if(!s) return '';\n  s = s.replace(/<\\/?(color|b|i|noparse|link)[^>]*>/g,'');\n  s = s.replace(/\\$[A-Za-z0-9_]+\\|([^|]*)\\|/g,'$1');\n  s = s.replace(/\\$UNIT_METERSPERSEC/g,' m/s');\n  s = s.replace(/\\$UNIT_KILOMETERS/g,' km');\n  s = s.replace(/\\$UNIT_METERS/g,' m');\n  s = s.replace(/\\$UNIT_SECONDS_MED/g,' s');\n  s = s.replace(/\\$UNIT_SECONDS/g,' s');\n  s = s.replace(/\\$UNIT_CENTIMETERS/g,' cm');\n  s = s.replace(/\\$UNIT_MILLIMETERS/g,' mm');\n  s = s.replace(/\\$UNIT_DEGREES/g,'\\u00b0');\n  s = s.replace(/\\$UNIT_GS/g,' G');\n  s = s.replace(/\\$UNIT_HP/g,' HP');\n  s = s.replace(/\\$GEN_NONE/g,'\\u2014');\n  s = s.replace(/\\$[A-Za-z0-9_]+/g,'');\n  s = s.replace(/[ \\t]+/g,' ');\n  return s.trim();\n}\n\n/* Compact seeker/guidance/warhead summary, ported from the reference\n   viewer's parseMissileDesc() so the abbreviation format matches exactly\n   (e.g. \"Direct \u00b7 CMD/SAH(RADAR) \u00b7 HE\"). */\nfunction parseMissileDesc(desc){\n  if(!desc) return '';\n  var colorMap={'#3BC81E':'#3ecf8e','#D4211D':'#e85c4a','#ED211D':'#e85c4a','#7CC6BC':'#7CC6BC','#D3D11F':'#f5d020'};\n  var gm={'$MISSILEGUIDANCE_MODE_DIRECT':'Direct','$MISSILEGUIDANCE_MODE_CRUISE':'Cruise','DIRECT':'Direct','CRUISE':'Cruise'};\n  var sm={'$MISSILESEEKER_MODE_ACTIVE_ABBREV':'ACT','$MISSILESEEKER_MODE_ARAD_HOJ_ABBREV':'HOJ',\n          '$MISSILESEEKER_MODE_PASSIVE_ABBREV':'PSV','$MISSILESEEKER_MODE_COMMAND_ABBREV':'CMD',\n          '$MISSILESEEKER_MODE_WAKE_HOMING_ABBREV':'WH','$MISSILESEEKER_MODE_SEMIACTIVE_ABBREV':'SAH',\n          '$MISSILESEEKER_MODE_ARAD_PULSED_ABBREV':'ARAD'};\n  var wm={'$MISSILEWARHEAD_SHORT_HEIMPACT':'HE','$MISSILEWARHEAD_SHORT_BLASTFRAG':'BF',\n          '$MISSILEWARHEAD_SHORT_KINETICPENETRATOR':'KP','$MISSILEWARHEAD_SHORT_PROXIMITY':'PRX',\n          '$MISSILEWARHEAD_SHORT_HEKP':'HEKP'};\n  var raw = desc.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');\n  function parseToken(token, isVal){\n    var parenIdx = token.indexOf('(');\n    var beforePart = parenIdx>=0 ? token.slice(0, parenIdx) : token;\n    var parenPart = parenIdx>=0 ? token.slice(parenIdx) : '';\n    // Only look for a color wrapping the seeker abbreviation itself\n    // *before* the parenthetical \u2014 otherwise a sensor override token\n    // that happens to also start with \"$MISSILESEEKER\" (e.g. THERM's\n    // $MISSILESEEKER_SIGOVERRIDE_ABBREV_THERM) gets mistaken for it.\n    var seekerColorMatch=beforePart.match(/<color=(#[0-9A-Fa-f]+)>[^$]*(\\$MISSILESEEKER[^<]*)<\\/color>/);\n    var seekerColor=seekerColorMatch?(colorMap[seekerColorMatch[1]]||seekerColorMatch[1]):'';\n    var abbrev='';\n    for(var sk in sm){ if(token.indexOf(sk)>=0){abbrev=sm[sk];break;} }\n    if(!abbrev) return '';\n    var sensorHTML='';\n    var sensorColorMatch=parenPart.match(/\\(<color=(#[0-9A-Fa-f]+)>([^<]+)<\\/color>\\)/);\n    if(sensorColorMatch){\n      var sc=colorMap[sensorColorMatch[1]]||sensorColorMatch[1];\n      var sensorText=sensorColorMatch[2].replace(/\\$[A-Z0-9_]+\\|([^|]*)\\|/g,'$1');\n      sensorHTML='(<span style=\"color:'+sc+'\">'+sensorText+'</span>)';\n    } else {\n      var plainMatch=parenPart.match(/\\(([^)]+)\\)/);\n      if(plainMatch){\n        var plainText=plainMatch[1].replace(/\\$[A-Z0-9_]+\\|([^|]*)\\|/g,'$1');\n        if(plainText) sensorHTML='('+plainText+')';\n      }\n    }\n    var abbrevHTML=seekerColor?'<span style=\"color:'+seekerColor+'\">'+abbrev+'</span>':abbrev;\n    var label=abbrevHTML+sensorHTML;\n    return isVal?'['+label+']':label;\n  }\n  function splitSeekers(p){\n    var PH=[];\n    var safe=p.replace(/<color=[^>]+>[^<]*<\\/color>/g,function(m){ PH.push(m); return '\\x01PH'+(PH.length-1)+'\\x01'; });\n    var toks=safe.split('/');\n    return toks.map(function(t){ return t.replace(/\\x01PH(\\d+)\\x01/g,function(_,i){return PH[parseInt(i)];}); });\n  }\n  var parts=raw.split(' - ');\n  var out=[];\n  for(var i=0;i<parts.length;i++){\n    var p=parts[i].trim();\n    var g=false;\n    for(var k in gm){ if(p.indexOf(k)>=0){ out.push(gm[k]); g=true; break; } }\n    if(g) continue;\n    var wf=false;\n    for(var wk in wm){ if(p.indexOf(wk)>=0){ out.push(wm[wk]); wf=true; break; } }\n    if(wf) continue;\n    if(p.indexOf('$MISSILESTAT_NONE')>=0||p==='NONE') continue;\n    var toks=splitSeekers(p);\n    var seekers=[];\n    for(var j=0;j<toks.length;j++){\n      var tok=toks[j].trim();\n      var bm=tok.match(/^\\[(.+)\\]$/);\n      var lbl=bm?parseToken(bm[1],true):parseToken(tok,false);\n      if(lbl) seekers.push(lbl);\n    }\n    if(seekers.length) out.push(seekers.join('/'));\n  }\n  return out.filter(Boolean).join(' \\u00b7 ');\n}\n\n/* ============================================================\n   MISSILE LongDescription -> stage / warhead aware stat parser\n   ============================================================ */\nvar STAT_EXCLUDE = {\n  'Failrate':1,'Boostturn':1,'Booststrafe':1,'Radarsig':1,'Boosttime':1,'Progtime':1,\n  'Health':1,'Wallthickness':1,'Damageperfragment':1,'Blastangle':1,\n  'Primaryseeker':1,'Backupseeker':1,'Secondaryseeker':1,'Validator':1,\n  'Controlmethod':1,'Targetingmode':1\n};\nvar WARHEAD_TYPE_MAP = {\n  'BLASTFRAG':'Blast Fragmentation','HEIMPACT':'HE Impact','HEKP':'HE-KP',\n  'KINETICPENETRATOR':'Kinetic Penetrator','PROXIMITY':'Proximity'\n};\nvar HEADER_LABEL_MAP = { 'MISSILESTAT_PENETRATOR':'Penetrator','MISSILESTAT_EXPLOSIVE':'Explosive' };\nvar PROP_KEYS = ['Speed','Distance','Topspeedtime','Turnrate','Terminals'];\nvar WH_KEYS = ['Armordamage','Componentdamage','Blastradius'];\n\nfunction parseMissileStatsBlock(longDesc){\n  var lines = (longDesc||'').split('\\n');\n  var stages=[], warheadSections=[], generalStats={};\n  var currentStage=null, currentWarhead=null;\n  var warheadType='', stageTriggerNote='';\n\n  for(var i=0;i<lines.length;i++){\n    var raw = lines[i];\n    var trimmed = raw.trim();\n    if(trimmed===''){ currentStage=null; currentWarhead=null; continue; }\n\n    var hm = trimmed.match(/^<b>(.*)<\\/b>$/);\n    if(hm){\n      var inner = hm[1].trim();\n      var label;\n      var pipeMatch = inner.match(/^\\$[A-Za-z0-9_]+\\|([^|]*)\\|$/);\n      var tokenMatch = inner.match(/^\\$([A-Za-z0-9_]+)$/);\n      if(pipeMatch){ label = pipeMatch[1].trim(); }\n      else if(tokenMatch){ label = HEADER_LABEL_MAP[tokenMatch[1]] || tokenMatch[1].replace(/^MISSILESTAT_/,''); }\n      else { label = decodeGameText(inner) || inner.replace(/<[^>]+>/g,'').trim(); }\n      if(label==='Penetrator' || label==='Explosive'){\n        currentWarhead = {name:label, stats:{}}; warheadSections.push(currentWarhead); currentStage=null;\n      } else if(label){\n        currentStage = {name:label, stats:{}}; stages.push(currentStage); currentWarhead=null;\n      }\n      continue;\n    }\n\n    var stg = raw.match(/Stage Trigger at (.+)/);\n    if(stg){ stageTriggerNote = decodeGameText(stg[1]); currentStage=null; continue; }\n\n    var m = raw.match(/\\$MISSILESTAT_([A-Z]+):\\s*(.+)/);\n    if(m){\n      var keyRaw = m[1];\n      if(keyRaw==='WARHEAD'){\n        var whMatch = m[2].match(/\\$MISSILEWARHEAD_DETAIL_([A-Z]+)/);\n        if(whMatch) warheadType = WARHEAD_TYPE_MAP[whMatch[1]] || whMatch[1];\n        continue;\n      }\n      var key = keyRaw.charAt(0)+keyRaw.slice(1).toLowerCase();\n      if(STAT_EXCLUDE[key]) continue;\n      var val = decodeGameText(m[2]).replace(/\\|.*$/,'').trim();\n      if(!val) continue;\n      if(currentWarhead){ currentWarhead.stats[key]=val; }\n      else if(currentStage){ currentStage.stats[key]=val; }\n      else { generalStats[key]=val; }\n    }\n  }\n  return { stages:stages, warheadSections:warheadSections, generalStats:generalStats, warheadType:warheadType, stageTriggerNote:stageTriggerNote };\n}\n\nfunction pickKeys(obj, keys){\n  var out={};\n  keys.forEach(function(k){ if(k in obj) out[k]=obj[k]; });\n  return out;\n}\nfunction omitKeys(obj, keys){\n  var out={};\n  Object.keys(obj).forEach(function(k){ if(keys.indexOf(k)<0) out[k]=obj[k]; });\n  return out;\n}\n\n/* ============================================================\n   CATEGORY (used only for the small color dot next to each slot)\n   ============================================================ */\n/* Hull -> flavor name abbreviation, ported from the reference AAR viewer\n   (e.g. \"Axford Heavy Cruiser\" -> \"Axford\", \"Bulk Hauler\" -> \"Marauder\"). */\nfunction shortClass(hullKey) {\n  if (!hullKey) return hullKey;\n  var map = [\n    ['Axford Heavy Cruiser', 'Axford'],\n    ['Solomon Battlecruiser', 'Solomon'],\n    ['Solomon Battle Cruiser', 'Solomon'],\n    ['Solomon Battleship', 'Solomon'],\n    ['Vauxhall Light Cruiser', 'Vauxhall'],\n    ['Keystone Destroyer', 'Keystone'],\n    ['Raines Frigate', 'Raines'],\n    ['Sprinter Corvette', 'Sprinter'],\n    ['Levy Escort Carrier', 'Levy'],\n    ['Levy Carrier', 'Levy'],\n    ['Container Hauler Refit', 'Mooreline'],\n    ['Container Hauler', 'Mooreline'],\n    ['Bulk Hauler', 'Marauder'],\n    ['Bulk Feeder', 'Flathead'],\n    ['Ore Carrier', 'Journeyman'],\n    ['Ocello Cruiser', 'Ocello'],\n    ['Ocello Command Cruiser', 'Ocello'],\n    ['Mooreline Monitor', 'Mooreline'],\n    ['Marauder Frigate', 'Marauder'],\n    ['Marauder', 'Marauder'],\n    ['Journeyman Logistics', 'Journeyman'],\n    ['Journeyman', 'Journeyman'],\n    ['Flathead Monitor', 'Flathead'],\n    ['Flathead', 'Flathead'],\n    ['Draugr Corvette', 'Draugr'],\n    ['Ferryman Carrier', 'Ferryman'],\n    ['Shuttle', 'Ferryman'],\n    ['Tugboat', 'Draugr'],\n  ];\n  for (var i = 0; i < map.length; i++) {\n    if (hullKey.indexOf(map[i][0]) >= 0) return map[i][1];\n  }\n  return hullKey.split(' ')[0];\n}\n\nfunction categorize(name){\n  var n=(name||'').toLowerCase();\n  if(/gun plotting|cannon|railgun|beam|turret/.test(n) && n.indexOf('hangar')<0) return 'gun';\n  if(/launcher|vls|cell|tube/.test(n)) return 'launcher';\n  if(/pdt|defender|stonewall|point defense|aurora|rebound/.test(n)) return 'pdt';\n  if(/radar|antenna|\\bcic\\b|combat information/.test(n)) return 'sensor';\n  if(/jammer|comms|decoy|deception|intelligence|emitter/.test(n)) return 'ewar';\n  if(/hangar|bay|strikedown|flight deck|deck gear|traversal|cradle/.test(n)) return 'hangar';\n  if(/reactor|drive|engine|battery|ftl|damage control|\\bdc \\b|repair|ammunition|magazine|citadel|crew|berthing|elevator|workshop|steering|bridge/.test(n)) return 'internal';\n  return 'other';\n}\nvar CAT_COLOR = {\n  gun:'var(--gun)', launcher:'var(--launcher)', pdt:'var(--pdt)', sensor:'var(--sensor)',\n  ewar:'var(--ewar)', hangar:'var(--hangar)', internal:'var(--internal)', other:'var(--text3)'\n};\n/* mount / component / module grouping, matching the game's own hardpoint\n   type labels (MT = Mount, CMP = Component, MOD = Module) */\nvar SLOT_TYPE = {\n  gun:'MT', launcher:'MT', pdt:'MT',\n  sensor:'CMP', ewar:'CMP', hangar:'CMP',\n  internal:'MOD', other:'MOD'\n};\nvar SLOT_TYPE_LABEL = { MT:'Mounts', CMP:'Compartments', MOD:'Modules' };\n\n/* Fixed socket template for all 14 stock Alliance/Protectorate hulls,\n   derived from two fully-equipped reference fleets and split into\n   Mount/Compartment/Module zones using the game's documented per-hull\n   counts. See buildSlotLayout() for how this is used. */\nvar HULL_SOCKET_TEMPLATE = {\"Stock/Shuttle\":[{\"key\":\"3mlCA6C6m0GI3wONZK_aqg\",\"slotType\":\"MT\"},{\"key\":\"fbAgHM9u302peFMSC0TidQ\",\"slotType\":\"MT\"},{\"key\":\"rbZhGCN7UUWcgLsNZkZXIA\",\"slotType\":\"MT\"},{\"key\":\"hh8PA01jxEytn9KuihcJ3Q\",\"slotType\":\"CMP\"},{\"key\":\"wDWAeeoAK0mAx3hbF1tMlA\",\"slotType\":\"CMP\"},{\"key\":\"CcSXjIupV0Kw-jxaV6HpEA\",\"slotType\":\"CMP\"},{\"key\":\"bInyh5AAt0y_m-3UaI8Ysw\",\"slotType\":\"MOD\"},{\"key\":\"-harMwD0o0OExuMqT63fTQ\",\"slotType\":\"MOD\"},{\"key\":\"zUeDN4FpYEyyWHIhTIgZFg\",\"slotType\":\"MOD\"},{\ c) continue;\n    var type = attrType(ic);\n    if(type && /Seeker|Guidance|Engine/.test(type)) continue;\n    var key = cleanKey(txt(ic,'ComponentKey'));\n    if(!key) continue;\n    if(/impact|fragmentation|kinetic|penetrator/i.test(key)) continue; // warhead payload, shown elsewhere\n    modules.push(key);\n  }\n  return modules;\n}\n\n/* ============================================================\n   MISSILE TEMPLATE PARSING\n   ============================================================ */\nfunction parseMissileTemplate(mt){\n  var longDesc = txt(mt,'LongDescription') || '';\n  var parsedStats = parseMissileStatsBlock(longDesc);\n  return {\n    saveKey: txt(mt,'SaveKey'),\n    designation: txt(mt,'Designation') || cleanKey(txt(mt,'SaveKey')),\n    nickname: txt(mt,'Nickname') || '',\n    cost: txt(mt,'Cost'),\n    body: cleanKey(txt(mt,'BodyKey')).replace(/\\s*Body$/i, ''),\n    avionics: parseMissileDesc(txt(mt,'Description')),\n    modules: parseMissileModules(mt),\n    stages: parsedStats.stages,\n    warheadSections: parsedStats.warheadSections,\n    generalStats: parsedStats.generalStats,\n    warheadType: parsedStats.warheadType,\n    stageTriggerNote: parsedStats.stageTriggerNote\n  };\n}\n\n/* ============================================================\n   CRAFT TEMPLATE PARSING\n   ============================================================ */\nvar CRAFT_STAT_KEEP = ['Combatspeed','Cruisespeed','Cruiserange','Loitertime','Fuelcapacity','Health','Turnrate','Radarsig'];\n\n/* Fixed hardware list, e.g. \"Nose: 20mm Gun\" / \"Countermeasures: Standard CM Launcher\" */\nfunction parseCraftComponents(longDesc){\n  var m = longDesc.match(/(?:\\$CRAFTSTAT_COMPONENTS:|<b>Components:<\\/b>)[^\\n]*\\n([\\s\\S]*?)(?:\\n\\s*\\n|$)/);\n  if(!m) return [];\n  var out = [];\n  m[1].split('\\n').forEach(function(line){\n    line = line.trim();\n    if(!line) return;\n    var socket, compRaw;\n    var lm = line.match(/\\$CRAFTSOCKETNAME_[A-Z0-9_]+\\|([^|]*)\\|:\\s*(.+)/);\n    if(lm){ socket = lm[1].trim(); compRaw = lm[2].trim(); }\n    else {\n      var lm2 = line.match(/^([^:]+):\\s*(.+)$/);\n      if(!lm2) return;\n      socket = lm2[1].trim(); compRaw = lm2[2].trim();\n    }\n    if(compRaw==='$GEN_NONE' || compRaw==='None') return; // empty hardpoint, skip\n    var cm = compRaw.match(/\\$CRAFTCOMPNAME_[A-Z0-9_]+\\|([^|]*)\\|/);\n    var comp = cm ? cm[1].trim() : decodeGameText(compRaw);\n    if(socket && comp) out.push({ socket:socket, component:comp });\n  });\n  return out;\n}\n\n/* Named ordnance loadout presets, e.g. \"R1 R2\" -> [\"6x R-1 'Perch' Rocket\", ...] */\nfunction parseCraftLoadouts(longDesc){\n  var block = longDesc.match(/(?:\\$CRAFTSTAT_LOADOUTS:|<b>Loadouts:<\\/b>)[^\\n]*\\n([\\s\\S]*)/);\n  if(!block) return [];\n  var out = [];\n  block[1].split('\\n').forEach(function(line){\n    line = line.trim();\n    if(!line) return;\n    var lm = line.match(/^([^:]+):\\s*(.+)$/);\n    if(!lm) return;\n    var name = lm[1].trim();\n    var itemsRaw = lm[2];\n    var items = itemsRaw.split(/(?<=[^\\d]),\\s*/).map(function(it){\n      it = it.trim();\n      var cm = it.match(/^(\\d+x)\\s*\\$AMMONAME_[A-Z0-9_]+\\|([^|]*)\\|$/);\n      if(cm) return cm[1]+' '+cm[2];\n      var cm2 = it.match(/^(\\d+x)\\s*(.+)$/);\n      if(cm2) return cm2[1]+' '+decodeGameText(cm2[2]);\n      return decodeGameText(it);\n    }).filter(Boolean);\n    if(name && items.length) out.push({ name:name, items:items });\n  });\n  return out;\n}\n\n/* Fixed base design codes per craft frame model \u2014 these are static per\n   the frame/hull template itself, not derived from the save file (a\n   save's SaveKey/GUID has no reliable relationship to it). Source:\n   https://namu.wiki/w/NEBULOUS:%20Fleet%20Command/\ud568\uc7ac\uae30 */\nvar FRAME_MODEL_CODE = {\n  'Halberd':   'RS-35',  // shared/common\n  'Tanto':     'PF-440', // Alliance\n  'Sundial':   'E-44',   // Alliance\n  'Claymore':  'B-86',   // Alliance\n  'Barracuda': 'PF-386', // Protectorate\n  'Pike':      'RF-286', // Protectorate\n  'Sturgeon':  'B-45'    // Protectorate\n};\n\n/* Primary display name split into two parts for styling (matching the\n   missile card's designation/nickname convention): a colored bold\n   \"code\" (e.g. \"B-86F\") and a plain gray \"tail\" (the nickname, or the\n   frame model name as fallback when there's no code or no nickname). */\nfunction craftPrimaryParts(frameModel, suffix, nickname, frame){\n  var code = FRAME_MODEL_CODE[frameModel];\n  var tail = nickname || frameModel || frame || 'Craft';\n  return { code: code ? (code + (suffix||'')) : '', tail: tail };\n}\n\nfunction parseCraftTemplate(ct){\n  var longDesc = txt(ct,'LongDescription') || '';\n  var lines = longDesc.split('\\n');\n  var frameModel = '';\n  for(var i=0;i<lines.length;i++){\n    var fm = lines[i].match(/\\$CRAFTSTAT_FRAMEMODEL:\\s*(.+)/);\n    if(fm){ frameModel = fm[1].trim(); break; }\n  }\n  var saveKey = txt(ct,'SaveKey');\n  var nickname = txt(ct,'Nickname') || '';\n  var suffix = txt(ct,'DesignationSuffix') || '';\n  var frame = cleanKey(txt(ct,'FrameKey'));\n  var parts = craftPrimaryParts(frameModel, suffix, nickname, frame);\n  return {\n    saveKey: saveKey,\n    frameModel: frameModel,\n    frame: frame,\n    nickname: nickname,\n    suffix: suffix,\n    cost: txt(ct,'Cost'),\n    primaryCode: parts.code,\n    primaryTail: parts.tail,\n    primaryLabel: (parts.code ? parts.code+' ' : '') + parts.tail,\n    components: parseCraftComponents(longDesc),\n    loadouts: parseCraftLoadouts(longDesc)\n  };\n}\n\n/* ============================================================\n   SHIP / SOCKET PARSING (slot order preserved, not category-grouped)\n   ============================================================ */\nfunction parseMissileLoad(cd){\n  var loads=[];\n  var container = child(cd,'MissileLoad') || child(cd,'Load');\n  if(container){\n    children(container,'MagSaveData').forEach(function(m){\n      loads.push({ key: txt(m,'MunitionKey'), qty: txt(m,'Quantity') });\n    });\n  }\n  return loads;\n}\nfunction parseHangar(cd){\n  var craft=[];\n  var keys = cd.getElementsByTagName('CraftTemplateKey');\n  for(var i=0;i<keys.length;i++) craft.push((keys[i].textContent||'').trim());\n  return craft;\n}\nfunction parseShip(ship){\n  var s = {\n    name: txt(ship,'Name'),\n    cost: txt(ship,'Cost'),\n    callsign: txt(ship,'Callsign'),\n    number: txt(ship,'Number'),\n    symbolOption: parseInt(txt(ship,'SymbolOption'),10) || 0,\n    hullKeyRaw: txt(ship,'HullType'),\n    hull: cleanKey(txt(ship,'HullType')),\n    sockets: []\n  };\n  var smap = child(ship,'SocketMap');\n  if(smap){\n    children(smap,'HullSocket').forEach(function(hs){\n      var name = cleanKey(txt(hs,'ComponentName'));\n      if(!name) return;\n      var entry = { key: txt(hs,'Key'), name: name, cat: categorize(name) };\n      var cd = child(hs,'ComponentData');\n      if(cd){\n        var loads = parseMissileLoad(cd);\n        if(loads.length) entry.loads = loads;\n        var craft = parseHangar(cd);\n        if(craft.length) entry.craft = craft;\n      }\n      s.sockets.push(entry);\n    });\n  }\n  return s;\n}\n\n/* Default color-dot category per zone, used only for slots that are\n   empty in the current ship (so there's no real installed component to\n   derive a color from). */\nvar DEFAULT_CAT_FOR_ZONE = { MT:'gun', CMP:'sensor', MOD:'internal' };\n\n/* Build slot numbering per ship, grouped into Mounts (MT) / Compartments\n   (CMP) / Modules (MOD).\n\n   Uses a fixed, built-in template (HULL_SOCKET_TEMPLATE) covering all 14\n   stock Alliance/Protectorate hulls, derived from two fully-equipped\n   reference fleets and cross-checked against the game's own documented\n   Mount/Compartment/Module counts per hull. Socket Keys are fixed by\n   hull design (confirmed: independently-built ships of the same hull\n   share identical Keys for the sockets they both use), so this template\n   reliably tells us every socket a hull has and its exact slot type \u2014\n   no per-session learning or guessing required.\n\n   For any hull not covered by the template, falls back to comparing\n   sibling ships within the current fleet only (and guessing slot type\n   from the installed component's apparent role), same as before. */\nfunction buildSlotLayout(ships){\n  var groups = {};\n  ships.forEach(function(s){ (groups[s.hullKeyRaw] = groups[s.hullKeyRaw] || []).push(s); });\n\n  Object.keys(groups).forEach(function(hullKey){\n    var group = groups[hullKey];\n    var template = HULL_SOCKET_TEMPLATE[hullKey];\n    var refOrder, typeByKey;\n\n    if(template){\n      refOrder = template.map(function(e){ return e.key; });\n      typeByKey = {};\n      template.forEach(function(e){ typeByKey[e.key] = e.slotType; });\n    } else {\n      var localCat = {}, localOrder = [];\n      group.forEach(function(s){\n        s.sockets.forEach(function(sock){\n          if(!(sock.key in localCat)){ localCat[sock.key]=sock.cat; localOrder.push(sock.key); }\n        });\n      });\n      refOrder = localOrder;\n      typeByKey = {};\n      localOrder.forEach(function(k){ typeByKey[k] = SLOT_TYPE[localCat[k]] || 'MOD'; });\n    }\n\n    var counters = {MT:0, CMP:0, MOD:0};\n    var labelByKey = {};\n    refOrder.forEach(function(k){\n      var st = typeByKey[k] || 'MOD';\n      counters[st]++;\n      labelByKey[k] = st + counters[st];\n    });\n\n    group.forEach(function(s){\n      var byKey = {};\n      s.sockets.forEach(function(sock){ byKey[sock.key]=sock; });\n      var slots = refOrder.map(function(k){\n        var sock = byKey[k];\n        var st = typeByKey[k] || 'MOD', label = labelByKey[k];\n        if(sock) return { key:k, empty:false, name:sock.name, cat:sock.cat, loads:sock.loads, craft:sock.craft, slotType:st, label:label };\n        return { key:k, empty:true, cat:DEFAULT_CAT_FOR_ZONE[st], slotType:st, label:label };\n      });\n      s.slots = slots;\n      s.slotGroups = {\n        MT: slots.filter(function(x){return x.slotType==='MT';}),\n        CMP: slots.filter(function(x){return x.slotType==='CMP';}),\n        MOD: slots.filter(function(x){return x.slotType==='MOD';})\n      };\n    });\n  });\n}\n\n/* ============================================================\n   FLEET PARSING\n   ============================================================ */\nasync function parseFleetXML(xmlText, fallbackName){\n  var parser = new DOMParser();\n  var doc = parser.parseFromString(xmlText, 'text/xml');\n  var errNode = doc.getElementsByTagName('parsererror')[0];\n  if(errNode) throw new Error('XML parsing failed');\n  var root = doc.documentElement;\n  var fleet = {\n    name: txt(root,'Name') || fallbackName,\n    points: txt(root,'TotalPoints'),\n    faction: cleanKey(txt(root,'FactionKey')),\n    desc: (txt(root,'Description') || '').replace(/<\\/?(color|b|i|noparse|link)[^>]*>/g,'').trim(),\n    ships: [],\n    missiles: [],\n    missileMap: {},\n    crafts: [],\n    craftMap: {}\n  };\n  var shipsEl = child(root,'Ships');\n  if(shipsEl){ children(shipsEl,'Ship').forEach(function(sh){ fleet.ships.push(parseShip(sh)); }); }\n  await buildSlotLayout(fleet.ships);\n\n  var mtEl = child(root,'MissileTypes');\n  if(mtEl){\n    children(mtEl,'MissileTemplate').forEach(function(mtEl2){\n      var m = parseMissileTemplate(mtEl2);\n      fleet.missiles.push(m);\n      if(m.saveKey) fleet.missileMap[m.saveKey]=m;\n    });\n  }\n  var ctEl = child(root,'CraftTypes');\n  if(ctEl){\n    children(ctEl,'CraftTemplate').forEach(function(ctEl2){\n      var c = parseCraftTemplate(ctEl2);\n      fleet.crafts.push(c);\n      if(c.saveKey) fleet.craftMap[c.saveKey]=c;\n    });\n  }\n  return fleet;\n}\n\n/* ============================================================\n   INLINE TAG RENDERERS (missile load / craft, used inside slots)\n   ============================================================ */\nfunction missileTag(loadEntry, fleet){\n  var m = fleet.missileMap[loadEntry.key];\n  var label = m ? (m.designation + (m.nickname ? \" \"+m.nickname : '')) : cleanKey(loadEntry.key);\n  return '<span class=\"load-tag\"><b>'+esc(loadEntry.qty)+'\\u00d7</b> '+esc(label)+'</span>';\n}\nfunction groupCraftList(list){\n  var order=[], counts={};\n  list.forEach(function(k){ if(!(k in counts)){ counts[k]=0; order.push(k); } counts[k]++; });\n  return order.map(function(k){ return {key:k, qty:counts[k]}; });\n}\nfunction craftDisplayInfo(craftKey, fleet){\n  var c = fleet.craftMap[craftKey];\n  if(c){\n    var icon = (c.frameModel && HULL_ICONS[c.frameModel]) || getCraftIcon(c.nickname, c.frame);\n    return { code: c.primaryCode, tail: c.primaryTail, icon: icon };\n  }\n  var label = cleanKey(craftKey);\n  return { code: '', tail: label, icon: getCraftIcon(label,'') };\n}\nfunction craftTag(craftKey, qty, fleet){\n  var info = craftDisplayInfo(craftKey, fleet);\n  var img = iconSpan(info.icon, 'ctIcon');\n  var qtyLabel = qty>1 ? '<span class=\"ctb\">'+qty+'\\u00d7</span> ' : '';\n  var label = info.code\n    ? '<span class=\"ctc\">'+esc(info.code)+'</span> <span class=\"ctm\">'+esc(info.tail)+'</span>'\n    : '<span class=\"ctc\">'+esc(info.tail)+'</span>';\n  return '<span class=\"craft-tag\">'+img+qtyLabel+label+'</span>';\n}\n\n/* ============================================================\n   RENDER: SHIP CARD (slot list, empty slots included)\n   ============================================================ */\nfunction renderSlotRow(slot, fleet){\n  if(slot.empty){\n    return '<div class=\"slot-row empty\"><span class=\"slot-num\">'+esc(slot.label)+'</span>'\n      + '<span class=\"slot-dot\" style=\"background:transparent;border:1px solid var(--border2)\"></span>'\n      + '<div class=\"slot-body\"><span class=\"slot-name is-empty\">\\u2014 Empty \\u2014</span></div></div>';\n  }\n  var loadRow = '';\n  if(slot.loads) loadRow += '<div class=\"loadrow\">'+slot.loads.map(function(l){return missileTag(l,fleet);}).join('')+'</div>';\n  if(slot.craft) loadRow += '<div class=\"loadrow\">'+groupCraftList(slot.craft).map(function(g){return craftTag(g.key,g.qty,fleet);}).join('')+'</div>';\n  return '<div class=\"slot-row\"><span class=\"slot-num\">'+esc(slot.label)+'</span>'\n    + '<span class=\"slot-dot\" style=\"background:'+CAT_COLOR[slot.cat]+'\"></span>'\n    + '<div class=\"slot-body\"><span class=\"slot-name\">'+esc(slot.name)+'</span>'+loadRow+'</div></div>';\n}\nfunction renderSlotGroup(groupType, list, fleet){\n  if(!list.length) return '';\n  return '<div class=\"slot-group\"><div class=\"slot-group-hd\">'+SLOT_TYPE_LABEL[groupType]+'</div><div class=\"slot-list\">'\n    + list.map(function(sl){return renderSlotRow(sl,fleet);}).join('')+'</div></div>';\n}\n\n/* Real hull classification codes (e.g. \"CH\" for Axford Heavy Cruiser).\n   Some hulls have multiple codes depending on the ship's SymbolOption\n   (0-indexed) \u2014 e.g. a Raines Frigate can read as FF/FFG/FFE depending\n   on which symbol the player picked for that ship. Source: player-\n   provided reference (matches the game's own designation lettering). */\nvar HULL_ROLE_CODES = {\n  'Stock/Sprinter Corvette':      ['FFL'],\n  'Stock/Raines Frigate':         ['FF','FFG','FFE'],\n  'Stock/Keystone Destroyer':     ['DD','DDG','DDE'],\n  'Stock/Vauxhall Light Cruiser': ['CL'],\n  'Stock/Axford Heavy Cruiser':   ['CH'],\n  'Stock/Levy Escort Carrier':    ['CVE'],\n  'Stock/Solomon Battleship':     ['BB'],\n  'Stock/Shuttle':                ['FFL'],\n  'Stock/Tugboat':                ['FFL'],\n  'Stock/Bulk Feeder':            ['MN'],\n  'Stock/Ore Carrier':            ['CVL'],\n  'Stock/Ocello Cruiser':         ['CC'],\n  'Stock/Bulk Hauler':            ['LN','CV'],\n  'Stock/Container Hauler Refit': ['LN','CV']\n};\nfunction hullRoleCode(s){\n  var variants = HULL_ROLE_CODES[s.hullKeyRaw];\n  if(!variants) return '';\n  return variants[s.symbolOption] || variants[0];\n}\n\nfunction shipTitleHTML(s){\n  return '<span class=\"snm-name\">'+esc(s.name)+'</span>';\n}\n\nfunction shipCodeLabel(s){\n  var roleCode = hullRoleCode(s);\n  var code = [roleCode, s.number].filter(Boolean).join('-');\n  return code;\n}\n\nfunction shipSlotsHTML(s, fleet){\n  return renderSlotGroup('MT', s.slotGroups.MT, fleet)\n    + renderSlotGroup('CMP', s.slotGroups.CMP, fleet)\n    + renderSlotGroup('MOD', s.slotGroups.MOD, fleet);\n}\n\nfunction renderShipCard(s, fleet){\n  var hullIcon = getHullIcon(s.hullKeyRaw);\n  var iconHtml = hullIcon ? iconSpan(hullIcon, 'hull-icon') : '<div class=\"hull-icon-ph\">\\u2b21</div>';\n  var code = shipCodeLabel(s);\n  var meta = [code?esc(code):'', esc(shortClass(s.hull)), s.callsign?('CS '+esc(s.callsign)):''].filter(Boolean).join(' \\u00b7 ');\n  var filled = s.slots.filter(function(x){return !x.empty;}).length;\n  var total = s.slots.length;\n\n  var card = document.createElement('div');\n  card.className='sc';\n  card.innerHTML = '<div class=\"ssum\">'\n    + iconHtml\n    + '<div class=\"sinf\"><div class=\"snm\">'+shipTitleHTML(s)+'</div>'+(meta?'<div class=\"smt\">'+meta+'</div>':'')+'</div>'\n    + '<div class=\"srht\"><div class=\"scost\">'+esc(s.cost)+' pts</div><div class=\"scount\">'+filled+' / '+total+' slots</div></div>'\n    + '<div class=\"chev\">\\u25B6</div>'\n    + '</div>'\n    + '<div class=\"sdet\">'+shipSlotsHTML(s, fleet)+'</div>';\n  card.querySelector('.ssum').addEventListener('click', function(){ card.classList.toggle('open'); });\n  return card;\n}\n\n/* ============================================================\n   RENDER: MISSILE TEMPLATE CARD\n   ============================================================ */\nfunction statGridHTML(statsObj){\n  var LABELS = {\n    Speed:'Speed', Distance:'Distance', Topspeedtime:'Top Speed Time', Turnrate:'Turn Rate',\n    Terminals:'Terminals', Armordamage:'Armor Damage', Componentdamage:'Component Damage',\n    Blastradius:'Blast Radius',\n    Combatspeed:'Combat Speed', Cruisespeed:'Cruise Speed', Cruiserange:'Cruise Range',\n    Loitertime:'Loiter Time', Fuelcapacity:'Fuel Capacity', Health:'Health', Radarsig:'Radar Signature'\n  };\n  var keys = Object.keys(statsObj);\n  if(!keys.length) return '';\n  return '<div class=\"statgrid\">'+keys.map(function(k){\n    return '<div class=\"stat\"><span class=\"k\">'+esc(LABELS[k]||k)+'</span><span class=\"v\">'+esc(statsObj[k])+'</span></div>';\n  }).join('')+'</div>';\n}\n\nfunction missileCardHTML(m){\n  var html = '<div class=\"tplc-hd\"><span><span class=\"tpl-dg msl\">'+esc(m.designation)+'</span> <span class=\"tpl-nn\">'+esc(m.nickname)+'</span></span><span class=\"tpl-cost\">'+esc(m.cost)+' pts</span></div>';\n  if(m.body) html += '<div class=\"tpl-body\">'+esc(m.body)+'</div>';\n  if(m.avionics) html += '<div class=\"tpl-avio\">'+m.avionics+'</div>';\n  if(m.modules && m.modules.length){\n    html += '<div class=\"loadrow\">'+m.modules.map(function(mo){return '<span class=\"load-tag\">'+esc(mo)+'</span>';}).join('')+'</div>';\n  }\n\n  // Propulsion (staged or single)\n  if(m.stages.length){\n    html += m.stages.map(function(st){\n      return '<div class=\"stat-section\"><div class=\"stat-section-hd\">'+esc(st.name)+'</div>'+statGridHTML(st.stats)+'</div>';\n    }).join('');\n    var propGeneral = pickKeys(m.generalStats, PROP_KEYS);\n    if(Object.keys(propGeneral).length) html += '<div class=\"stat-section\">'+statGridHTML(propGeneral)+'</div>';\n    if(m.stageTriggerNote) html += '<div class=\"stage-note\">Stage transition at '+esc(m.stageTriggerNote)+'</div>';\n  } else {\n    var propOnly = pickKeys(m.generalStats, PROP_KEYS);\n    if(Object.keys(propOnly).length) html += '<div class=\"stat-section\">'+statGridHTML(propOnly)+'</div>';\n  }\n\n  // Warhead\n  var whGeneral = pickKeys(m.generalStats, WH_KEYS);\n  if(m.warheadSections.length){\n    html += m.warheadSections.map(function(ws){\n      return '<div class=\"stat-section\"><div class=\"stat-section-hd\">'+esc(ws.name)+(m.warheadType?' \\u2014 '+esc(m.warheadType):'')+'</div>'+statGridHTML(ws.stats)+'</div>';\n    }).join('');\n  } else if(Object.keys(whGeneral).length || m.warheadType){\n    html += '<div class=\"stat-section\"><div class=\"stat-section-hd\">Warhead'+(m.warheadType?' \\u2014 '+esc(m.warheadType):'')+'</div>'+statGridHTML(whGeneral)+'</div>';\n  }\n  return html;\n}\n\nfunction renderMissileCard(m){\n  var div = document.createElement('div');\n  div.className='tplc';\n  div.innerHTML = missileCardHTML(m);\n  return div;\n}\n\n/* ============================================================\n   RENDER: CRAFT TEMPLATE CARD\n   ============================================================ */\nfunction craftCardHTML(c){\n  var icon = (c.frameModel && HULL_ICONS[c.frameModel]) || getCraftIcon(c.nickname,c.frame);\n  var iconHtml = iconSpan(icon, 'tpIcon');\n\n  var componentsHtml = '';\n  if(c.components && c.components.length){\n    componentsHtml = '<div class=\"stat-section\"><div class=\"stat-section-hd\">Installed Components</div><div class=\"comp-rows\">'\n      + c.components.map(function(cc){\n          return '<div class=\"comp-row\"><span class=\"cr-k\">'+esc(cc.socket)+'</span><span class=\"cr-v\">'+esc(cc.component)+'</span></div>';\n        }).join('')\n      + '</div></div>';\n  }\n\n  var titleHtml = c.primaryCode\n    ? '<span class=\"tpl-dg craft\">'+esc(c.primaryCode)+'</span> <span class=\"tpl-nn\">'+esc(c.primaryTail)+'</span>'\n    : '<span class=\"tpl-dg craft\">'+esc(c.primaryTail)+'</span>';\n\n  return '<div class=\"tplc-icon\">'+iconHtml+titleHtml+'</div>'\n    + '<div class=\"tplc-hd\"><span class=\"tpl-body\">'+esc(c.frameModel||c.frame)+'</span><span class=\"tpl-cost\">'+esc(c.cost)+' pts</span></div>'\n    + componentsHtml;\n}\n\nfunction renderCraftCard(c){\n  var div = document.createElement('div');\n  div.className='tplc';\n  div.innerHTML = craftCardHTML(c);\n  return div;\n}\n\n/* ============================================================\n   RENDER: FLEET VIEW (single fleet, no tabs)\n   ============================================================ */\nvar FLEET = null;\nvar RAW_FLEET_TEXT = null;\n\n/* When embedded as an iframe tab (e.g. inside a combined viewer page),\n   use the parent frame's location/origin for URL-based state instead of\n   this iframe's own (a srcdoc iframe has no real address of its own).\n   Falls back to this document's own window when not embedded, or when\n   the parent is cross-origin and inaccessible. */\nfunction effectiveWin(){\n  try{\n    if(window.parent && window.parent !== window && window.parent.location.href) return window.parent;\n  }catch(e){ /* cross-origin parent, fall back to self */ }\n  return window;\n}\nfunction effectiveOrigin(){\n  return effectiveWin().location.origin;\n}\n\n\nfunction fleetIconStripHTML(f){\n  var items = f.ships.map(function(s){\n    var icon = getHullIcon(s.hullKeyRaw);\n    var iconHtml = icon ? iconSpan(icon, 'fi-icon') : '<div class=\"fi-icon-ph\">\\u2b21</div>';\n    var label = shipCodeLabel(s) || shortClass(s.hull);\n    return '<div class=\"fi-item\" title=\"'+esc(s.name)+'\">'+iconHtml+'<div class=\"fi-label\">'+esc(label)+'</div></div>';\n  }).join('');\n  return '<div class=\"fleet-icons\">'+items+'</div>';\n}\n\nfunction renderFleetView(){\n  var view = document.getElementById('fleetView');\n  view.innerHTML='';\n  if(!FLEET) return;\n  var f = FLEET;\n\n  var banner = document.createElement('div');\n  banner.className='banner fade-in';\n  var factionIcon = FACTION_ICONS[f.faction];\n  var factionValueHtml = iconSpan(factionIcon, 'faction-icon') + esc(f.faction||'Unknown');\n  var strip = '<div class=\"stat-strip\">'\n    + '<div class=\"sst\"><div class=\"sst-l\">Faction</div><div class=\"sst-v faction-v\">'+factionValueHtml+'</div></div>'\n    + '<div class=\"sst\"><div class=\"sst-l\">Points</div><div class=\"sst-v\">'+esc(f.points)+'</div></div>'\n    + '<div class=\"sst\"><div class=\"sst-l\">Ships</div><div class=\"sst-v\">'+f.ships.length+'</div></div>'\n    + (f.missiles.length? '<div class=\"sst\"><div class=\"sst-l\">Custom Missiles</div><div class=\"sst-v\">'+f.missiles.length+'</div></div>':'')\n    + (f.crafts.length? '<div class=\"sst\"><div class=\"sst-l\">Custom Craft</div><div class=\"sst-v\">'+f.crafts.length+'</div></div>':'')\n    + '</div>';\n  banner.innerHTML = '<h2>'+esc(f.name)+'</h2>'+strip+(f.desc? '<div class=\"bdesc\">'+esc(f.desc)+'</div>' : '')+fleetIconStripHTML(f);\n  view.appendChild(banner);\n\n  var shipSection = document.createElement('div');\n  shipSection.className='section';\n  shipSection.innerHTML = '<div class=\"sh\">Ships</div>';\n  var grid = document.createElement('div');\n  grid.className='ships-grid';\n  f.ships.forEach(function(s){ grid.appendChild(renderShipCard(s,f)); });\n  shipSection.appendChild(grid);\n  view.appendChild(shipSection);\n\n  if(f.missiles.length){\n    var mslSection = document.createElement('div');\n    mslSection.className='section';\n    mslSection.innerHTML = '<div class=\"sh\">Custom Missiles</div>';\n    var mgrid = document.createElement('div');\n    mgrid.className='tpl-grid';\n    f.missiles.forEach(function(m){ mgrid.appendChild(renderMissileCard(m)); });\n    mslSection.appendChild(mgrid);\n    view.appendChild(mslSection);\n  }\n\n  if(f.crafts.length){\n    var craftSection = document.createElement('div');\n    craftSection.className='section';\n    craftSection.innerHTML = '<div class=\"sh\">Custom Strike Craft</div>';\n    var cgrid = document.createElement('div');\n    cgrid.className='tpl-grid';\n    f.crafts.forEach(function(c){ cgrid.appendChild(renderCraftCard(c)); });\n    craftSection.appendChild(cgrid);\n    view.appendChild(craftSection);\n  }\n}\n\n/* ============================================================\n   SHARE-AS-IMAGE\n   ============================================================ */\nvar _shareImageDataUrl = null;\n\nfunction buildShareCard(f){\n  function fN(n){ var v=parseFloat(n); return isNaN(v)? esc(n) : Math.round(v).toLocaleString('en-US'); }\n\n  var shipsHTML = f.ships.map(function(s){\n    var icon = getHullIcon(s.hullKeyRaw);\n    var iconHtml = icon ? iconSpan(icon, 'hull-icon') : '<div class=\"hull-icon-ph\">\\u2b21</div>';\n    var code = shipCodeLabel(s);\n    var meta = [code||'', shortClass(s.hull), s.callsign?('CS '+s.callsign):''].filter(Boolean).join(' \\u00b7 ');\n    var isLarge = s.slots.length > 20;\n    var cardClass = isLarge ? 'sc open rc-ship-wide' : 'sc open';\n    var detClass = isLarge ? 'sdet sdet-2col' : 'sdet';\n    return '<div class=\"'+cardClass+'\"><div class=\"ssum\" style=\"cursor:default\">'\n      + iconHtml\n      + '<div class=\"sinf\"><div class=\"snm\">'+shipTitleHTML(s)+'</div>'+(meta?'<div class=\"smt\">'+esc(meta)+'</div>':'')+'</div>'\n      + '<div class=\"srht\"><div class=\"scost\">'+fN(s.cost)+' pts</div></div>'\n      + '</div>'\n      + '<div class=\"'+detClass+'\" style=\"display:block\">'+shipSlotsHTML(s, f)+'</div>'\n      + '</div>';\n  }).join('');\n\n  var missilesHTML = f.missiles.map(function(m){\n    return '<div class=\"tplc\">'+missileCardHTML(m)+'</div>';\n  }).join('');\n\n  var craftsHTML = f.crafts.map(function(c){\n    return '<div class=\"tplc\">'+craftCardHTML(c)+'</div>';\n  }).join('');\n\n  var factionIcon = FACTION_ICONS[f.faction];\n  var factionIconHtml = iconSpan(factionIcon, '', \"height:20px;width:20px;background-size:contain;background-repeat:no-repeat;background-position:center;margin-right:6px;vertical-align:middle;display:inline-block\");\n\n  return '<div class=\"rc-wrap\">'\n    + '<div class=\"rc-header\"><div>'\n    + '<div class=\"rc-logo\">NEBULOUS<span> // </span>FLEET COMMAND</div>'\n    + '<div class=\"rc-title\">'+esc(f.name)+'</div>'\n    + '<div class=\"rc-sub\">'+factionIconHtml+esc(f.faction||'Unknown Faction')+'</div></div>'\n    + '<div style=\"text-align:right\"><div class=\"rc-stat-label\">Total Points</div><div class=\"rc-stat-val\" style=\"color:#e8c04e\">'+fN(f.points)+'</div></div>'\n    + '</div>'\n    + '<div class=\"rc-strip\">'\n    + '<div class=\"rc-stat\"><div class=\"rc-stat-label\">Ships</div><div class=\"rc-stat-val\">'+f.ships.length+'</div></div>'\n    + '<div class=\"rc-stat\"><div class=\"rc-stat-label\">Custom Missiles</div><div class=\"rc-stat-val\">'+f.missiles.length+'</div></div>'\n    + '<div class=\"rc-stat\"><div class=\"rc-stat-label\">Custom Craft</div><div class=\"rc-stat-val\">'+f.crafts.length+'</div></div>'\n    + '</div>'\n    + (f.desc ? '<div class=\"bdesc\" style=\"margin-bottom:16px\">'+esc(f.desc)+'</div>' : '')\n    + fleetIconStripHTML(f)\n    + '<div class=\"rc-ships-title\" style=\"margin-top:16px\">Ship Designs</div>'\n    + '<div class=\"rc-ship-list\">'+shipsHTML+'</div>'\n    + (missilesHTML ? '<div class=\"rc-ships-title\" style=\"margin-top:20px\">Missile Designs</div><div class=\"rc-ship-list\">'+missilesHTML+'</div>' : '')\n    + (craftsHTML ? '<div class=\"rc-ships-title\" style=\"margin-top:20px\">Strike Craft Designs</div><div class=\"rc-ship-list\">'+craftsHTML+'</div>' : '')\n    + '<div class=\"rc-footer\"><div class=\"rc-footer-left\">Nebulous: Fleet Command</div><div class=\"rc-footer-right\">FLEET LOADOUT VIEWER</div></div>'\n    + '</div>';\n}\n\nfunction openShareModal(){\n  document.getElementById('shareModal').classList.add('open');\n  document.getElementById('sharePreviewImg').style.display='none';\n  document.getElementById('sharePlaceholder').style.display='block';\n  document.getElementById('shareDownloadBtn').disabled=true;\n  _shareImageDataUrl=null;\n}\nfunction closeShareModal(){ document.getElementById('shareModal').classList.remove('open'); }\n\nfunction generateShareImage(){\n  if(!FLEET) return;\n  document.getElementById('shareGenerating').classList.add('show');\n  document.getElementById('shareGenBtn').disabled=true;\n  var card = document.getElementById('shareCard');\n  card.innerHTML = buildShareCard(FLEET);\n  setTimeout(function(){\n    html2canvas(card,{backgroundColor:'#0c0c0e',scale:2,useCORS:true,logging:false,width:960}).then(function(canvas){\n      _shareImageDataUrl = canvas.toDataURL('image/png');\n      var img = document.getElementById('sharePreviewImg');\n      img.src=_shareImageDataUrl; img.style.display='block';\n      document.getElementById('sharePlaceholder').style.display='none';\n      document.getElementById('shareDownloadBtn').disabled=false;\n      document.getElementById('shareGenerating').classList.remove('show');\n      document.getElementById('shareGenBtn').disabled=false;\n    }).catch(function(e){\n      alert('Render error: '+e.message);\n      document.getElementById('shareGenerating').classList.remove('show');\n      document.getElementById('shareGenBtn').disabled=false;\n    });\n  },200);\n}\nfunction downloadShareImage(){\n  if(!_shareImageDataUrl) return;\n  var a=document.createElement('a');\n  var slug = (FLEET && FLEET.name ? FLEET.name : 'fleet').replace(/[^a-z0-9]+/gi,'-').toLowerCase();\n  a.download = 'fleet-'+slug+'.png';\n  a.href=_shareImageDataUrl;\n  a.click();\n}\n\n/* ============================================================\n   FILE HANDLING (single fleet only)\n   ============================================================ */\nasync function loadFleetText(text, name){\n  document.getElementById('dropZone').style.display='none';\n  document.getElementById('dashboard').style.display='block';\n  document.getElementById('fleetView').innerHTML = '<div style=\"padding:3rem;text-align:center;color:var(--text3);font-family:var(--mono);font-size:13px\">Loading fleet\\u2026</div>';\n  try{\n    FLEET = await parseFleetXML(text, name);\n    RAW_FLEET_TEXT = text;\n    document.getElementById('resetBtn').style.display='inline-block';\n    document.getElementById('downloadBtn').style.display='inline-block';\n    document.getElementById('shareBtnRow').classList.add('show');\n    renderFleetView();\n    return true;\n  }catch(err){\n    console.error('Parse error for', name, err);\n    document.getElementById('dropZone').style.display='block';\n    document.getElementById('dashboard').style.display='none';\n    alert('Failed to parse '+(name||'file')+'. Please check that this is a valid Nebulous .fleet file.');\n    return false;\n  }\n}\n\nfunction handleFiles(fileList){\n  var files = Array.prototype.slice.call(fileList);\n  if(!files.length) return;\n  var file = files[0];\n  if(!/\\.fleet$/i.test(file.name)){\n    alert('Only .fleet files can be uploaded.');\n    return;\n  }\n  var reader = new FileReader();\n  reader.onload = function(e){ loadFleetText(e.target.result, file.name.replace(/\\.[^.]+$/,'')); };\n  reader.readAsText(file, 'utf-8');\n}\n\nfunction downloadFleetFile(){\n  if(!RAW_FLEET_TEXT || !FLEET) return;\n  var slug = (FLEET.name || 'fleet').replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'') || 'fleet';\n  var blob = new Blob([RAW_FLEET_TEXT], { type: 'application/xml' });\n  var url = URL.createObjectURL(blob);\n  var a = document.createElement('a');\n  a.href = url;\n  a.download = slug + '.fleet';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);\n}\n\nfunction resetAll(){\n  FLEET = null;\n  RAW_FLEET_TEXT = null;\n  document.getElementById('dropZone').style.display='block';\n  document.getElementById('dashboard').style.display='none';\n  document.getElementById('resetBtn').style.display='none';\n  document.getElementById('downloadBtn').style.display='none';\n  document.getElementById('shareBtnRow').classList.remove('show');\n  document.getElementById('fileInput').value='';\n  var url = new URL(effectiveWin().location.href);\n  url.searchParams.delete('id');\n  effectiveWin().history.replaceState({}, '', url);\n}\n\n/* ============================================================\n   SHARE VIA LINK (Netlify Function + Blobs backend)\n   ============================================================ */\nfunction openLinkModal(){\n  document.getElementById('linkModal').classList.add('open');\n  document.getElementById('linkPreArea').style.display='block';\n  document.getElementById('linkResultArea').style.display='none';\n}\nfunction closeLinkModal(){ document.getElementById('linkModal').classList.remove('open'); }\n\nasync function generateShareLink(){\n  if(!RAW_FLEET_TEXT) return;\n  document.getElementById('linkGenerating').classList.add('show');\n  document.getElementById('linkGenBtn').disabled = true;\n  try{\n    var res = await fetch(effectiveOrigin()+'/.netlify/functions/upload', {\n      method: 'POST',\n      headers: { 'Content-Type': 'text/plain' },\n      body: RAW_FLEET_TEXT\n    });\n    var data = null;\n    try{ data = await res.json(); }catch(parseErr){ /* non-JSON error body, e.g. host-level 500 */ }\n    if(!res.ok){\n      var msg = (data && (data.detail || data.error)) || ('HTTP '+res.status);\n      throw new Error(msg);\n    }\n    var url = new URL(effectiveWin().location.href);\n    url.search = ''; url.hash = '';\n    url.searchParams.set('id', data.id);\n    document.getElementById('linkResultInput').value = url.toString();\n    document.getElementById('linkResultLabel').textContent = data.deduped\n      ? 'This fleet was already shared before \\u2014 here\\u2019s the existing link:'\n      : 'Anyone with this link can view the fleet:';\n    document.getElementById('linkPreArea').style.display='none';\n    document.getElementById('linkResultArea').style.display='block';\n  }catch(err){\n    alert('Failed to generate link: '+err.message);\n  }\n  document.getElementById('linkGenerating').classList.remove('show');\n  document.getElementById('linkGenBtn').disabled = false;\n}\nfunction copyShareLink(){\n  var input = document.getElementById('linkResultInput');\n  input.select();\n  input.setSelectionRange(0, 99999);\n  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(input.value); }\n  else { document.execCommand('copy'); }\n}\n\nasync function loadFromShareId(id){\n  document.getElementById('dropZone').style.display='none';\n  document.getElementById('dashboard').style.display='block';\n  document.getElementById('fleetView').innerHTML = '<div style=\"padding:3rem;text-align:center;color:var(--text3);font-family:var(--mono);font-size:13px\">Loading shared fleet\\u2026</div>';\n  try{\n    var res = await fetch(effectiveOrigin()+'/.netlify/functions/get?id='+encodeURIComponent(id));\n    if(!res.ok) throw new Error(res.status===404 ? 'Link not found or expired' : 'Fetch failed ('+res.status+')');\n    var text = await res.text();\n    await loadFleetText(text, 'shared-'+id);\n  }catch(err){\n    console.error(err);\n    document.getElementById('dropZone').style.display='block';\n    document.getElementById('dashboard').style.display='none';\n    alert('Failed to load the shared link: '+err.message);\n  }\n}\n\nvar dz = document.getElementById('dropZone');\ndocument.getElementById('fileInput').addEventListener('change', function(e){ handleFiles(e.target.files); });\ndz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag'); });\ndz.addEventListener('dragleave', function(){ dz.classList.remove('drag'); });\ndz.addEventListener('drop', function(e){\n  e.preventDefault(); dz.classList.remove('drag');\n  handleFiles(e.dataTransfer.files);\n});\n\n(function initFromUrl(){\n  try{\n    var params = new URLSearchParams(effectiveWin().location.search);\n    var id = params.get('id');\n    if(id) loadFromShareId(id);\n  }catch(e){ /* cross-origin parent; rely on postMessage fallback below */ }\n})();\nwindow.addEventListener('message', function(e){\n  if(e.data && e.data.type === 'nebulous-fleet-load-id' && e.data.id){\n    loadFromShareId(e.data.id);\n  }\n});\n<\/script>\n</body>\n</html>\n";
